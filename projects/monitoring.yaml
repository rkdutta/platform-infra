# AppProject for the Monitoring & Logging plane — metrics and observability.
# Guardrail: apps in this plane may only source from the repos listed below.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  labels:
    plane: monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Monitoring & Logging plane — metrics and observability
  sourceRepos:
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://prometheus-community.github.io/helm-charts
    - https://github.com/rkdutta/platform-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
