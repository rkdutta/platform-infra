# copy this file and rename remove the "-example" from the file name.

apiVersion: v1
kind: Secret
metadata:
  name: platform-infra-repo-creds-example
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: <REPO URL>
  username: <YOUR_USER_NAME>          # can be anything non-empty for GitHub PAT auth
  password: <YOUR_GITHUB_PAT>