# EXAMPLE ONLY — placeholders. Do NOT put a real PAT here and do NOT commit the
# real secret. This file sits outside manifests/ so neither the root-app nor the
# harbor-replication app ever applies it.
#
# The GHCR package is PRIVATE, so Harbor needs a GitHub PAT with `read:packages`
# to pull. Create the real secret out-of-band (it is git-ignored):
#
#   kubectl -n harbor create secret generic ghcr-replication-credentials \
#     --from-literal=GHCR_USERNAME=rkdutta \
#     --from-literal=GHCR_TOKEN=ghp_your_read_packages_token \
#     --from-literal=HARBOR_ADMIN_PASSWORD=Harbor12345
#
# (HARBOR_ADMIN_PASSWORD matches harborAdminPassword in the harbor Helm values.)
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-replication-credentials
  namespace: harbor
type: Opaque
stringData:
  GHCR_USERNAME: "rkdutta"
  GHCR_TOKEN: "ghp_REPLACE_ME_read_packages_scope"
  HARBOR_ADMIN_PASSWORD: "Harbor12345"
