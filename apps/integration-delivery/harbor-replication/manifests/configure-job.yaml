# Idempotent Job that configures Harbor's GHCR pull-replication via the REST API.
#
# Run as an Argo CD PostSync hook with hook-delete-policy BeforeHookCreation, so
# it is deleted+recreated (and thus re-runs) on every sync. That keeps Harbor's
# replication config reconciled even after Harbor's DB is wiped on a cluster
# rebuild. The script itself is also idempotent (create-or-update).
#
# What it configures:
#   * a `ghcr` registry endpoint (type github-ghcr, basic auth = GH user + PAT)
#   * one pull replication policy per app repo (the github-ghcr adapter needs
#     an exact repo name — no wildcards), named ghcr-<repo>:
#       - ghcr-demo-api-go  -> rkdutta/demo-api-go
#       - ghcr-demo-web-go  -> rkdutta/demo-web-go
#       - ghcr-demo-api-py  -> rkdutta/demo-api-py
#       - ghcr-demo-web-py  -> rkdutta/demo-web-py
#       - ghcr-teams-app    -> rkdutta/teams-app
#       - ghcr-teams-api    -> rkdutta/teams-api
#       - ghcr-teams-operator -> rkdutta/teams-operator
#     Each: tag "**" (carries the cosign sha256-<digest>.sig / .att artifacts —
#     required for keyless verify), dest namespace `platform`, flatten-all so
#     they land at platform/<repo> (matching the deploy manifests the demo-go
#     and demo-py ApplicationSets read).
#       - scheduled every 10 minutes
#   * one immediate replication run
#
# Uses curlimages/curl (curl + busybox, runs non-root, no package install) so the
# hardened securityContext (non-root, read-only rootfs) holds. jq is avoided;
# the few numeric ids are parsed from the small name-filtered JSON responses.
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-configure-ghcr-replication
  namespace: harbor
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: harbor-replication
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: harbor-replication
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghcr-replication-credentials
                  key: HARBOR_ADMIN_PASSWORD
            - name: GHCR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ghcr-replication-credentials
                  key: GHCR_USERNAME
            - name: GHCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ghcr-replication-credentials
                  key: GHCR_TOKEN
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              API="http://harbor-core/api/v2.0"
              AUTH="admin:${HARBOR_ADMIN_PASSWORD}"

              # Registry response: fields serialize alphabetically and no nested
              # object carries an id before it, so the first "id" is the registry.
              first_id() { grep -o '"id":[0-9]\{1,\}' | head -1 | tr -dc '0-9' || true; }
              # Policy id: the nested dest_registry.id:0 (local "Local") sorts
              # before the policy's own id, so anchor on the (unique) policy name.
              # $1 = policy name; reads the JSON list on stdin.
              pol_id_of() { grep -o "\"id\":[0-9]\{1,\},\"name\":\"$1\"" | head -1 | tr -dc '0-9' || true; }

              echo "waiting for the Harbor API..."
              i=0
              while [ "$i" -lt 30 ]; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -u "$AUTH" "$API/systeminfo" || true)
                if [ "$code" = "200" ]; then echo "harbor ready"; break; fi
                i=$((i+1)); echo "  not ready ($code), retry $i/30"; sleep 5
              done

              reg_body() {
                printf '{"name":"ghcr","type":"github-ghcr","url":"https://ghcr.io","insecure":false,"credential":{"type":"basic","access_key":"%s","access_secret":"%s"}}' \
                  "$GHCR_USERNAME" "$GHCR_TOKEN"
              }
              # $1 = policy name, $2 = ghcr repo (pulled as rkdutta/$2), $3 = registry id.
              pol_body() {
                printf '{"name":"%s","description":"Pull %s (+cosign sig/att) from GHCR","enabled":true,"override":true,"deletion":false,"replicate_deletion":false,"src_registry":{"id":%s},"dest_namespace":"platform","dest_namespace_replace_count":-1,"filters":[{"type":"name","value":"rkdutta/%s"},{"type":"tag","value":"**"}],"trigger":{"type":"scheduled","trigger_settings":{"cron":"0 */10 * * * *"}}}' \
                  "$1" "$2" "$3" "$2"
              }

              # 1) GHCR registry endpoint (create or update credentials)
              reg_id=$(curl -s -u "$AUTH" "$API/registries?name=ghcr" | first_id)
              if [ -z "$reg_id" ]; then
                echo "creating ghcr registry endpoint"
                reg_body | curl -sf -u "$AUTH" -X POST "$API/registries" -H 'Content-Type: application/json' -d @-
                reg_id=$(curl -s -u "$AUTH" "$API/registries?name=ghcr" | first_id)
              else
                echo "ghcr registry exists (id=$reg_id); refreshing credentials"
                reg_body | curl -sf -u "$AUTH" -X PUT "$API/registries/$reg_id" -H 'Content-Type: application/json' -d @-
              fi
              echo "ghcr registry id=$reg_id"

              # 2) one pull policy per app repo. The github-ghcr adapter needs
              #    an exact repository name (no wildcards), so we iterate.
              #    demo-* = the demo workloads; teams-* = the team-management
              #    platform components (built by the platform-idp release.yml).
              for repo in demo-api-go demo-web-go demo-api-py demo-web-py \
                          teams-app teams-api teams-operator; do
                polname="ghcr-$repo"
                pol_id=$(curl -s -u "$AUTH" "$API/replication/policies?name=$polname" | pol_id_of "$polname")
                if [ -z "$pol_id" ]; then
                  echo "creating replication policy $polname"
                  pol_body "$polname" "$repo" "$reg_id" | curl -sf -u "$AUTH" -X POST "$API/replication/policies" -H 'Content-Type: application/json' -d @-
                  pol_id=$(curl -s -u "$AUTH" "$API/replication/policies?name=$polname" | pol_id_of "$polname")
                else
                  echo "$polname exists (id=$pol_id); updating"
                  pol_body "$polname" "$repo" "$reg_id" | curl -sf -u "$AUTH" -X PUT "$API/replication/policies/$pol_id" -H 'Content-Type: application/json' -d @-
                fi
                echo "$polname id=$pol_id"

                # 3) kick off an immediate run (the scheduled trigger runs anyway)
                if [ -n "$pol_id" ] && [ "$pol_id" -gt 0 ] 2>/dev/null; then
                  echo "triggering $polname"
                  printf '{"policy_id":%s}' "$pol_id" | curl -s -u "$AUTH" -X POST "$API/replication/executions" -H 'Content-Type: application/json' -d @- || true
                else
                  echo "skipping immediate trigger for $polname (id unresolved: '$pol_id')"
                fi
              done

              echo "harbor GHCR replication configured."
