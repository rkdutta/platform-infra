# Currently not used.
# Values for prometheus-community/kube-prometheus-stack (chart 87.10.1)
# Referenced by application.yaml via $values. Customize as needed.

fullnameOverride: grafana-stack

# --- Grafana ---
grafana:
  enabled: true
  # Change this before production use (or wire it to a Secret / sealed-secret).
  adminPassword: changeme
  defaultDashboardsEnabled: true
  persistence:
    enabled: true
    size: 10Gi
  # ingress:
  #   enabled: true
  #   ingressClassName: nginx
  #   hosts:
  #     - grafana.example.com

# --- Prometheus ---
prometheus:
  prometheusSpec:
    retention: 15d
    # Discover ServiceMonitors/PodMonitors in ALL namespaces, not just those
    # created by this chart's release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

# --- Alertmanager ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# --- Exporters / control-plane scraping ---
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  fullnameOverride: grafana-stack-kube-state-metrics
