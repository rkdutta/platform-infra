apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  # Keep the app around until child resources (incl. CRDs) are cleaned up.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: monitoring
  # Single source: pull the chart from the public Helm repo and inline the
  # values below. No git repo access needed. Declarative equivalent of:
  #   helm install monitoring-stack prometheus-community/kube-prometheus-stack \
  #     --namespace monitoring --values monitoring-stack-values.yaml
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.10.1
    helm:
      releaseName: monitoring-stack
      # Kept in sync with monitoring-stack-values.yaml (that file is now just a
      # human-readable reference; ArgoCD reads only what's inlined here).
      values: |
        fullnameOverride: grafana-stack

        grafana:
          enabled: true
          adminPassword: changeme
          defaultDashboardsEnabled: true
          persistence:
            enabled: true
            size: 10Gi

        prometheus:
          prometheusSpec:
            retention: 15d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi

        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          fullnameOverride: grafana-stack-kube-state-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Equivalent of `helm install --namespace monitoring` creating the ns.
      - CreateNamespace=true
      # kube-prometheus-stack ships very large CRDs; server-side apply avoids
      # the "metadata.annotations: Too long" client-side apply error.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
