apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  # After ingress-nginx (wave 0) so the nginx IngressClass exists when the
  # server-ingress below is created. OpenBao has no other dependency; ArgoCD
  # retries converge it regardless of ordering.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Built-in `default` project (platform-infra AppProject does not exist yet).
  project: default

  # Official OpenBao chart. Declarative equivalent of:
  #   helm repo add openbao https://openbao.github.io/openbao-helm
  #   helm upgrade --install openbao openbao/openbao -n openbao --create-namespace
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.28.4   # appVersion v2.5.5
    helm:
      releaseName: openbao
      values: |
        # Standalone server: a single pod using the `file` storage backend on a
        # PersistentVolumeClaim (kind's local-path StorageClass). Data survives
        # pod restarts, but OpenBao comes up SEALED — you must run a one-time
        # `bao operator init` + unseal before it becomes Ready (see notes below).
        server:
          standalone:
            enabled: true
          # 10Gi PVC mounted at /openbao/data (chart default; set explicitly).
          dataStorage:
            enabled: true
            size: 10Gi

          # Expose the UI/API to the browser via ingress-nginx over TLS at
          # https://openbao.127.0.0.1.sslip.io:8443 (host :8443 -> :443). nginx
          # terminates TLS with the self-signed wildcard `platform-tls` secret and
          # proxies HTTP to the openbao Service on :8200 (listener runs
          # tls_disable = 1 internally). NOTE: `platform-tls` is created manually
          # per namespace and is NOT auto-replicated — it must exist in the
          # `openbao` namespace or the ingress serves nginx's fake cert.
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - host: openbao.127.0.0.1.sslip.io
                paths:
                  - /
            tls:
              - secretName: platform-tls
                hosts:
                  - openbao.127.0.0.1.sslip.io

        # Create the UI Service (the standalone config already sets `ui = true`).
        ui:
          enabled: true

        # Skip the OpenBao agent sidecar injector (a separate Deployment +
        # MutatingWebhookConfiguration). Not needed to run the server; flip to
        # true later if you want automatic secret injection into pods.
        injector:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
