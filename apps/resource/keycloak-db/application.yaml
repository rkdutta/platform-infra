apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-db
  namespace: argocd
  # After the CNPG operator (wave 0), before Keycloak (wave 2).
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: resource
spec:
  # Built-in `default` project (platform-infra AppProject does not exist yet).
  project: resource
  # The CNPG Cluster CR lives in git. `path` points at the manifests/ subdir so
  # this Application manifest itself is NOT rendered as a cluster resource.
  source:
    repoURL: https://github.com/rkdutta/platform-infra.git
    targetRevision: main
    path: apps/resource/keycloak-db/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      # The Cluster CR fails to apply until the CNPG CRDs exist; retries here
      # let it converge without manual intervention.
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
