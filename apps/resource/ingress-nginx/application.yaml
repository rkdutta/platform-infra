apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  # Wave 0: the ingress controller should exist before any app that ships an
  # Ingress (teams-api, teams-app, keycloak) expects to be routable.
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: resource
spec:
  # Built-in `default` project (no dedicated AppProject exists yet).
  project: resource
  # ingress-nginx via its official Helm chart, tuned for kind. Declarative
  # equivalent of the kind "deploy.yaml" recipe:
  #   https://kind.sigs.k8s.io/docs/user/ingress/
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1 # ingress-nginx 1.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          # Bind :80/:443 directly on the node. The kind cluster maps the
          # control-plane container's 80->host 8080 and 443->host 8443, so
          # http://<host>.127.0.0.1.sslip.io:8080 reaches the controller.
          hostPort:
            enabled: true
          # With hostPort we don't need a LoadBalancer/NodePort Service.
          service:
            type: ClusterIP
            # Pin the ClusterIP so it's deterministic across cluster recreation.
            # (Historically the kind nodes' /etc/hosts fix routed
            # harbor.127.0.0.1.sslip.io here; it now routes harbor via
            # host.docker.internal instead — see platform-base
            # node-hosts/platform-hosts-fix.sh — because Harbor's token realm is
            # on :8443, which the in-cluster ClusterIP can't serve. The pin is
            # kept for determinism.) Immutable on an existing Service, so this
            # only takes effect on a freshly created cluster.
            clusterIP: "10.96.209.177"
          # Schedule onto the control-plane node kind labeled `ingress-ready`
          # (see platform-base main.tf) and tolerate its control-plane taint.
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # No external LB Service to publish; avoids ingress status warnings.
          publishService:
            enabled: false
          # Also serve Ingresses that omit ingressClassName.
          watchIngressWithoutClass: true
          # Disable the admission webhook: on a single-node kind cluster it only
          # adds a sync-time race (Ingress creation rejected until the webhook
          # pod is Ready) with little benefit.
          admissionWebhooks:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
