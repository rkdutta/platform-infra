          # --- In-cluster reachability for Argo CD's OIDC login (platform-base/argocd.tf) ---
          # platform-auth.127.0.0.1.sslip.io resolves to 127.0.0.1 everywhere
          # (that's the whole point of sslip.io) — from a browser that's the
          # host machine, but from *inside* a pod like argocd-server it's the
          # pod's own loopback. And Keycloak's issuer has :8443 hardcoded (see
          # this Application's --hostname flag above), which the ingress-nginx
          # Service doesn't listen on internally at all — only 80/443; :8443 is
          # a kind Docker port mapping that only exists on the host. Two pieces
          # fix this, same pattern as apps/security/ratify's harbor-trust.yaml
          # (which solves the identical problem for harbor.127.0.0.1.sslip.io):
          # a small additional Service exposing :8443 against the *same* pods
          # ingress-nginx-controller's own Service already selects, and a
          # CoreDNS rewrite pointing the hostname at it.
          - apiVersion: v1
            kind: Service
            metadata:
              name: platform-auth-ingress-8443
              namespace: ingress-nginx
              labels:
                app.kubernetes.io/managed-by: keycloak-application
            spec:
              selector:
                app.kubernetes.io/component: controller
                app.kubernetes.io/instance: ingress-nginx
                app.kubernetes.io/name: ingress-nginx
              ports:
                - name: https-8443
                  port: 8443
                  targetPort: https
                  protocol: TCP
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: keycloak-dns-trust
              namespace: keycloak
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: keycloak-dns-trust
            rules:
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["get", "update", "patch"]
              - apiGroups: ["apps"]
                resources: ["deployments"]
                verbs: ["get", "patch"]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: keycloak-dns-trust
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: keycloak-dns-trust
            subjects:
              - kind: ServiceAccount
                name: keycloak-dns-trust
                namespace: keycloak
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: keycloak-dns-trust
              namespace: keycloak
              annotations:
                argocd.argoproj.io/hook: PostSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              labels:
                app: keycloak-dns-trust
            spec:
              backoffLimit: 4
              template:
                metadata:
                  labels:
                    app: keycloak-dns-trust
                spec:
                  serviceAccountName: keycloak-dns-trust
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  volumes:
                    - name: tmp
                      emptyDir: {}
                  containers:
                    - name: configure
                      image: alpine/k8s:1.31.0
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      env:
                        - name: HOME
                          value: /tmp
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
                      command: ["/bin/bash", "-eu", "-c"]
                      args:
                        - |
                          echo "CoreDNS rewrite platform-auth.127.0.0.1.sslip.io -> platform-auth-ingress-8443 (idempotent)"
                          cf=$(kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}')
                          target="platform-auth-ingress-8443.ingress-nginx.svc.cluster.local"
                          if printf '%s' "$cf" | grep -q "rewrite name platform-auth.127.0.0.1.sslip.io $target"; then
                            echo "   already present and correct"
                          else
                            # Drop any stale rewrite line for this hostname first (e.g. an
                            # earlier version pointing at the wrong target), then add the
                            # correct one - keeps this idempotent across re-runs AND across
                            # fixes to this script itself.
                            stripped=$(printf '%s\n' "$cf" | grep -v 'rewrite name platform-auth.127.0.0.1.sslip.io')
                            newcf=$(printf '%s\n' "$stripped" | awk -v t="$target" '{print} /^[[:space:]]*ready[[:space:]]*$/ && !d {print "    rewrite name platform-auth.127.0.0.1.sslip.io " t; d=1}')
                            kubectl -n kube-system create cm coredns --from-literal=Corefile="$newcf" --dry-run=client -o yaml | kubectl apply -f -
                            kubectl -n kube-system rollout restart deploy coredns
                            echo "   rewrite added"
                          fi
        extraVolumes: |
          - name: realm-import
            configMap:
              name: keycloak-realm-import

        extraVolumeMounts: |
          - name: realm-import
            mountPath: /opt/keycloak/data/import
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
