apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  # After the DB (wave 1). Keycloak crash-loops until Postgres is reachable,
  # then self-heals — the wave just avoids the noisy first attempts.
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: security
spec:
  # Built-in `default` project (platform-infra AppProject does not exist yet).
  project: security
  # codecentric keycloakx chart — runs the UPSTREAM quay.io/keycloak/keycloak
  # image (Quarkus), no Bitnami. Declarative equivalent of:
  #   helm repo add codecentric https://codecentric.github.io/helm-charts
  #   helm upgrade --install keycloak codecentric/keycloakx -n keycloak ...
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.2.2 # Keycloak 26.6.4
    helm:
      releaseName: keycloak
      values: |
        # Point Keycloak at the CloudNativePG cluster. Username is the CNPG
        # `owner`; the password is read from the CNPG-generated secret.
        database:
          vendor: postgres
          hostname: keycloak-db-rw        # CNPG read-write Service
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db-app # generated by CNPG
          existingSecretKey: password

        # The keycloakx chart ships NO default command — without this the
        # container runs bare `kc.sh`, prints usage, and CrashLoopBackOffs.
        # `start` (non-optimized) auto-builds using the KC_DB* env above.
        command:
          - "/opt/keycloak/bin/kc.sh"
          - "start"
          - "--http-enabled=true"      # nginx terminates TLS; KC stays HTTP internally
          - "--http-port=8080"
          # Fixed https frontend URL — full URL form (scheme + host + PORT + path).
          # Browsers require a secure (https) context for the keycloak-js SSO flow
          # (Storage Access API / cross-site cookies), so the UI is served over TLS
          # at :8443 via ingress-nginx. Both the :8443 port and the /auth path MUST
          # be present or keycloak-js token validation (iss claim) fails. The
          # explicit :8443 is required because nginx forwards X-Forwarded-Port=443
          # (its internal port), so KC can't infer the external port on its own.
          - "--hostname=https://platform-auth.127.0.0.1.sslip.io:8443/auth"
          - "--health-enabled=true"    # serves /auth/health on mgmt port 9000
          - "--metrics-enabled=true"   #   (chart's liveness/readiness probes)
          - "--import-realm"
          - "--spi-login-protocol-openid-connect-cors-enabled=true"
          - "--spi-login-protocol-openid-connect-cors-allowed-origins=*"
          - "--spi-login-protocol-openid-connect-cors-allowed-methods=GET,POST,OPTIONS,PUT,DELETE"
          - "--spi-login-protocol-openid-connect-cors-allowed-headers=*"

        # nginx sends X-Forwarded-* (not RFC-7239 Forwarded), so tell Keycloak to
        # trust those headers — otherwise it sees the internal HTTP hop and would
        # emit http:// URLs / non-Secure cookies. (Chart default mode: forwarded.)
        proxy:
          mode: xforwarded

        # Bootstrap admin (Keycloak 26 env names). CHANGE THESE before real use
        # and ideally move them into a Secret / sealed-secret rather than git.
        extraEnv: |
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            value: changeme

        # Expose Keycloak to the browser via ingress-nginx over TLS at
        # https://platform-auth.127.0.0.1.sslip.io:8443/auth (host :8443 -> :443).
        # nginx terminates TLS using the platform-tls secret (self-signed
        # wildcard *.127.0.0.1.sslip.io) and proxies HTTP to KC. KC serves under
        # /auth (KC_HTTP_RELATIVE_PATH); the `/` prefix covers it.
        ingress:
          enabled: true
          ingressClassName: nginx
          rules:
            - host: platform-auth.127.0.0.1.sslip.io
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - platform-auth.127.0.0.1.sslip.io
              secretName: platform-tls

        # --- Realm import ---------------------------------------------------
        # Mount the exported "teams" realm so `kc.sh start --import-realm`
        # (above) creates it on first boot. The ConfigMap below is the inline
        # copy ArgoCD actually renders; keep it in sync with the reference file
        # apps/keycloak/teams-realm.json.
        extraManifests:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: keycloak-realm-import
            data:
              teams-realm.json: |
                {
                  "realm": "teams",
                  "enabled": true,
                  "sslRequired": "none",
                  "registrationAllowed": false,
                  "resetPasswordAllowed": true,
                  "editUsernameAllowed": false,
                  "bruteForceProtected": true,
                  "clients": [
                    {
                      "clientId": "teams-ui",
                      "name": "Teams UI",
                      "description": "Angular Teams Management UI",
                      "enabled": true,
                      "clientAuthenticatorType": "client-secret",
                      "redirectUris": [
                        "https://teams-ui.127.0.0.1.sslip.io:8443/*",
                        "http://teams-ui.127.0.0.1.sslip.io:8080/*",
                        "http://platform-auth.127.0.0.1.sslip.io/*",
                        "http://engineering-platform.local/*",
                        "http://localhost:4200/*",
                        "http://localhost:4201/*",
                        "http://rdutta.coder/*"
                      ],
                      "webOrigins": [
                        "https://teams-ui.127.0.0.1.sslip.io:8443",
                        "http://teams-ui.127.0.0.1.sslip.io:8080",
                        "http://platform-auth.127.0.0.1.sslip.io",
                        "http://engineering-platform.local",
                        "http://localhost:4200",
                        "http://localhost:4201",
                        "http://rdutta.coder:4200"
                      ],
                      "publicClient": true,
                      "protocol": "openid-connect",
                      "attributes": {
                        "post.logout.redirect.uris": "https://teams-ui.127.0.0.1.sslip.io:8443/*##http://teams-ui.127.0.0.1.sslip.io:8080/*##http://platform-auth.127.0.0.1.sslip.io/*##http://localhost:4200/*##http://localhost:4201/*##http://rdutta.coder:*"
                      },
                      "protocolMappers": [
                        {
                          "name": "groups",
                          "protocol": "openid-connect",
                          "protocolMapper": "oidc-group-membership-mapper",
                          "config": {
                            "claim.name": "groups",
                            "full.path": "false",
                            "access.token.claim": "true",
                            "id.token.claim": "true",
                            "userinfo.token.claim": "true"
                          }
                        }
                      ]
                    },
                    {
                      "clientId": "teams-cli",
                      "name": "Teams CLI",
                      "description": "Command-line client — Authorization Code + PKCE (S256), loopback redirect (RFC 8252). Public, no secret; browser flow only.",
                      "enabled": true,
                      "protocol": "openid-connect",
                      "publicClient": true,
                      "standardFlowEnabled": true,
                      "directAccessGrantsEnabled": false,
                      "implicitFlowEnabled": false,
                      "serviceAccountsEnabled": false,
                      "redirectUris": [
                        "http://localhost:8400/callback",
                        "http://127.0.0.1:8400/callback"
                      ],
                      "webOrigins": [],
                      "attributes": {
                        "pkce.code.challenge.method": "S256",
                        "post.logout.redirect.uris": "http://localhost:8400/*##http://127.0.0.1:8400/*"
                      },
                      "protocolMappers": [
                        {
                          "name": "groups",
                          "protocol": "openid-connect",
                          "protocolMapper": "oidc-group-membership-mapper",
                          "config": {
                            "claim.name": "groups",
                            "full.path": "false",
                            "access.token.claim": "true",
                            "id.token.claim": "true",
                            "userinfo.token.claim": "true"
                          }
                        }
                      ]
                    }
                  ],
                  "users": [
                    {
                      "username": "teamlead1",
                      "enabled": true,
                      "firstName": "Team",
                      "lastName": "Lead",
                      "email": "teamlead1@company.com",
                      "emailVerified": true,
                      "credentials": [
                        {
                          "type": "password",
                          "value": "password123",
                          "temporary": false
                        }
                      ],
                      "realmRoles": ["team-leader"],
                      "groups": ["/team-sss"]
                    },
                    {
                      "username": "teamlead2",
                      "enabled": true,
                      "firstName": "Team",
                      "lastName": "Lead Two",
                      "email": "teamlead2@company.com",
                      "emailVerified": true,
                      "credentials": [
                        {
                          "type": "password",
                          "value": "password123",
                          "temporary": false
                        }
                      ],
                      "realmRoles": ["team-leader"],
                      "groups": ["/team-mmm"]
                    },
                    {
                      "username": "admin",
                      "enabled": true,
                      "firstName": "Admin",
                      "lastName": "User",
                      "email": "admin@company.com",
                      "emailVerified": true,
                      "credentials": [
                        {
                          "type": "password",
                          "value": "admin123",
                          "temporary": false
                        }
                      ],
                      "realmRoles": ["admin", "team-leader"]
                    }
                  ],
                  "roles": {
                    "realm": [
                      {
                        "name": "team-leader",
                        "description": "Can create and manage teams"
                      },
                      {
                        "name": "admin",
                        "description": "Full administrative access"
                      }
                    ]
                  },
                  "groups": [
                    { "name": "team-sss" },
                    { "name": "team-mmm" }
                  ]
                }
        extraVolumes: |
          - name: realm-import
            configMap:
              name: keycloak-realm-import

        extraVolumeMounts: |
          - name: realm-import
            mountPath: /opt/keycloak/data/import
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
