# REPORT-ONLY (audit): tenant images without verifiable supply-chain evidence
# (cosign signature + SBOM/vuln/quality attestations) are non-compliant.
# dryrun -> surfaced in Gatekeeper audit + the portal compliance badges, never
# blocks admission.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sSupplyChainEvidence
metadata:
  name: tenant-supply-chain-evidence
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
