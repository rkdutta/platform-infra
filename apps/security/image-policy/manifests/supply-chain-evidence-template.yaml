# REPORT-ONLY: an image is non-compliant if its supply-chain evidence can't be
# verified. Calls the `ratify-provider` external-data provider (installed by the
# ratify app), which checks the cosign signature + SBOM/vuln/quality attestations
# attached to each image. Self-contained (own kind) so it doesn't depend on the
# ratify app's own ConstraintTemplate being present.
#
# Excludes containers injected by platform mutation webhooks (see
# apps/security/tenant-guardrails's openbao-sidecar-*.yaml: "spiffe-helper" +
# "openbao-agent", both vendor images the tenant never chose and can't change)
# - matched by container name, which is stable and platform-controlled, unlike
# image tags. Without this, every project that opts into OpenBao access gets
# flagged non-compliant purely because of platform-owned sidecar images, and
# that verdict rolls straight into the project's compliance badge
# (compliance.py: any violation in the namespace -> non_compliant project-wide)
# even though the tenant has no way to act on it. Whether these two images
# themselves get real supply-chain evidence is a separate, platform-side
# concern - orthogonal to what a tenant's compliance signal should reflect.
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8ssupplychainevidence
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sSupplyChainEvidence
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8ssupplychainevidence

        injected_sidecar_names := {"spiffe-helper", "openbao-agent"}

        remote_data := response {
          containers := [c | c = input.review.object.spec.containers[_]; not injected_sidecar_names[c.name]]
          init_containers := [c | c = input.review.object.spec.initContainers[_]; not injected_sidecar_names[c.name]]
          ephemeral_containers := [c | c = input.review.object.spec.ephemeralContainers[_]; not injected_sidecar_names[c.name]]
          images := [c.image | c = containers[_]]
          images_init := [c.image | c = init_containers[_]]
          images_ephemeral := [c.image | c = ephemeral_containers[_]]
          other_images := array.concat(images_init, images_ephemeral)
          all_images := array.concat(other_images, images)
          response := external_data({"provider": "ratify-provider", "keys": all_images})
        }

        violation[{"msg": msg}] {
          general_violation[{"result": msg}]
        }

        # provider itself errored
        general_violation[{"result": result}] {
          err := remote_data.system_error
          err != ""
          result := sprintf("supply-chain provider error: %s", [err])
        }
        general_violation[{"result": result}] {
          count(remote_data.errors) > 0
          result := sprintf("could not read supply-chain evidence: %s", [remote_data.errors])
        }
        # verification returned a negative result for an image
        general_violation[{"result": result}] {
          subject_validation := remote_data.responses[_]
          subject_validation[1].isSuccess == false
          result := sprintf("image %s has no verifiable supply-chain evidence — non-compliant", [subject_validation[0]])
        }
