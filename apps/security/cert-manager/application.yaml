apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  # Infra-level; deploy early so a ClusterIssuer / Certificates can be created
  # afterwards. The ClusterIssuer lives in a separate app (see cert-manager
  # notes) because it needs the CRDs + webhook below to be Ready first.
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # CRD schemas are applied server-side; diff server-side too so the large
    # auto-generated schemas don't show as permanent phantom drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: security
spec:
  # Built-in `default` project (platform-infra AppProject does not exist yet).
  project: security
  # Official Jetstack chart. Declarative equivalent of:
  #   helm repo add jetstack https://charts.jetstack.io
  #   helm upgrade --install cert-manager jetstack/cert-manager \
  #     -n cert-manager --create-namespace --set crds.enabled=true
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.0
    helm:
      releaseName: cert-manager
      values: |
        # Install the cert-manager CRDs (Certificate, ClusterIssuer, ...) with
        # the chart. `crds.enabled` is the modern replacement for the deprecated
        # `installCRDs`; keep=true (chart default) retains CRDs if the app is
        # deleted so issued Certificates aren't garbage-collected by accident.
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager ships large CRDs; server-side apply avoids the client-side
      # "metadata.annotations: Too long" error.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
