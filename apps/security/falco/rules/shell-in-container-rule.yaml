# Human-readable reference for the custom Falco rule (same pattern as
# root-detect-rule.yaml): Kustomize turns this file into a key of the
# falco-custom-rules ConfigMap, which Falco mounts at /etc/falco/rules.d and
# loads on top of its default ruleset. Falco's built-in lists/macros
# (shell_binaries, shell_procs, spawned_process, container) are already defined
# by the default rules, so we reference them directly.
#
# Goal: catch anyone opening a shell INSIDE a running container — `kubectl exec`,
# `docker exec`, or a shell popped through an app exploit. Our workloads run
# their app process directly (distroless Go binary / uvicorn for the Python
# apps) and never spawn a shell of their own, so a shell in a container is a
# strong intrusion signal.
#
# NOTE: Falco is a DETECTION engine — this rule raises a CRITICAL alert (to
# stdout + falcosidekick); it does not itself kill the process. See the app
# README / hand-off notes for the enforcement options (RBAC on pods/exec, a
# pods/exec admission webhook, or Falco Talon to auto-kill the pod).

# 1) Interactive shell (has a controlling TTY) — the classic `kubectl exec -it`
#    / `docker exec -it`. Highest confidence.
- rule: Terminal Shell In Container
  desc: >
    An interactive shell (with a TTY) was started inside a container. Workload
    containers here never need an interactive shell, so treat this as
    unauthorized hands-on access.
  condition: >
    spawned_process
    and container
    and shell_procs
    and proc.tty != 0
    and proc.pname exists
    and not proc.pname in (shell_binaries)
  output: >
    Interactive shell opened in container
    (user=%user.name uid=%user.uid shell=%proc.name parent=%proc.pname
     cmdline=%proc.cmdline tty=%proc.tty
     container=%container.name image=%container.image.repository:%container.image.tag
     pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [shell, container, mitre_execution, T1059]

# 2) Non-interactive shell (no TTY) exec'd into a container — e.g.
#    `kubectl exec <pod> -- sh -c '<cmd>'` or an automated foothold, which the
#    TTY rule above would miss. proc.vpid != 1 excludes containers whose own
#    entrypoint is a shell (PID 1), so we only flag shells launched AFTER the
#    container started, and `not proc.pname in (shell_binaries)` flags just the
#    entry shell, not every command typed inside it.
- rule: Shell Spawned In Container
  desc: >
    A shell process was launched inside a running container other than as the
    container's own entrypoint (PID 1) — the shape of `kubectl exec -- sh -c`
    or a shell spawned by an exploited process, with or without a TTY.
  condition: >
    spawned_process
    and container
    and shell_procs
    and proc.tty = 0
    and proc.vpid != 1
    and proc.pname exists
    and not proc.pname in (shell_binaries)
  output: >
    Shell spawned in container
    (user=%user.name uid=%user.uid shell=%proc.name parent=%proc.pname
     cmdline=%proc.cmdline tty=%proc.tty
     container=%container.name image=%container.image.repository:%container.image.tag
     pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [shell, container, mitre_execution, T1059]
