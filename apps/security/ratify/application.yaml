apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ratify
  namespace: argocd
  annotations:
    # Ratify installs CRDs (Store/Verifier/KeyManagementProvider/Policy);
    # server-side apply avoids client-side apply size/annotation issues and
    # matches how gatekeeper is applied.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: security
spec:
  project: security
  # Ratify = the verification engine Gatekeeper calls (via its external-data
  # API) to verify image signatures/attestations at admission (Architecture A).
  # Installed into gatekeeper-system alongside the controller it plugs into.
  source:
    repoURL: https://notaryproject.github.io/ratify
    chart: ratify
    targetRevision: 1.15.4
    helm:
      releaseName: ratify
      values: |
        # Provider TLS (Gatekeeper <-> Ratify mTLS) is self-rotated; no manual
        # certs needed. cert-manager is present in the cluster.
        featureFlags:
          RATIFY_CERT_ROTATION: true

        # Disable Ratify's image-mutation webhook. It is cluster-wide and, with
        # oras.useHttp below, fails closed when it can't resolve public HTTPS
        # registries (e.g. the trivy scan-job image) — which would block
        # unrelated pods. We only need validation (signature verification),
        # scoped to the ratify-demo namespace by the Constraint.
        provider:
          enableMutation: false

        # The kind local registry is plain HTTP.
        # Harbor is HTTPS via the in-cluster ingress (CoreDNS rewrites
        # harbor.127.0.0.1.sslip.io -> ingress-nginx). Ratify trusts Harbor's
        # self-signed platform-tls CA via SSL_CERT_DIR below.
        oras:
          useHttp: false

        # Add the mounted platform-tls CA (/etc/ratify-ca) on top of the image's
        # built-in public roots, so oras pulls Harbor over HTTPS AND cosign can
        # still reach public Sigstore infra (Rekor/Fulcio/TUF). The CA volume +
        # mount are added by the kustomize patch (this app is helm+kustomize).
        env:
          - name: SSL_CERT_DIR
            value: /etc/ratify-ca

        # This demo verifies cosign signatures only; disable the Notation
        # verifier so cosign-signed (but not notation-signed) images pass.
        notation:
          enabled: false

        # KEYLESS (Sigstore/OIDC) cosign verification. Instead of trusting a
        # fixed public key, trust images whose cosign signature carries a Fulcio
        # certificate issued to the demo-api-go RELEASE WORKFLOW's OIDC identity
        # and logged in Rekor. This matches the keyless signing in that repo's
        # .github/workflows/release.yml. Leaving cosignKeys empty makes the chart
        # build a keyless trust policy (from cosign.keyless) rather than a
        # key-based one.
        #
        # NOTE: keyless verification requires the Ratify pod to reach the public
        # Sigstore infra (Fulcio root via TUF + Rekor) and requires the cosign
        # signature artifact to live alongside the image in the registry Ratify
        # pulls from (use `cosign copy` if the image is mirrored across
        # registries).
        cosignKeys: []
        cosign:
          enabled: true
          scopes: ["*"]
          tLogVerify: true          # require a Rekor transparency-log entry
          keyless:
            ctLogVerify: true
            # main pushes and v* tags yield different cert identity refs, so
            # match both with a RegExp (RE2). Issuer is the GitHub Actions OIDC.
            # Any rkdutta repo's release.yml workflow (demo-api-go, demo-web-go,
            # and future apps) on main or a v* tag. Trust boundary = our org's
            # release pipelines, not a single repo.
            certificateIdentityRegExp: '^https://github\.com/rkdutta/[^/]+/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$'
            certificateOIDCIssuer: 'https://token.actions.githubusercontent.com'
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  # The ratify-harbor-trust hook Job (apps/security/ratify/manifests) mounts the
  # Harbor CA into this Deployment; ignore those fields so self-heal doesn't
  # strip the volume/mount the Job adds.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ratify
      namespace: gatekeeper-system
      jsonPointers:
        - /spec/template/spec/volumes
        - /spec/template/spec/containers/0/volumeMounts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
