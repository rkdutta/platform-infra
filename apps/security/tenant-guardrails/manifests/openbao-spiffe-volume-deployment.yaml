# Gives every tenant Deployment a path to its own SPIFFE identity, so it can
# authenticate to OpenBao without any static credential. Three volumes:
#
# 1. spiffe-workload-api: the SPIFFE CSI driver's ephemeral volume — mounts
#    the SPIRE Workload API socket (already issuing every pod in every
#    team-* namespace an SVID today via the spire-default fallback
#    ClusterSPIFFEID, see apps/security/spire/ — nothing currently reads it).
#    Only the spiffe-helper sidecar (see openbao-sidecar-deployment.yaml)
#    mounts this; it never needs to reach the app container.
# 2. openbao-agent-shared: an emptyDir the spiffe-helper sidecar writes the
#    fetched JWT-SVID into, and the openbao-agent sidecar reads it from (plus
#    writes its own auto-auth token there) — the hand-off surface between the
#    two sidecars.
# 3. openbao-agent-config: the ConfigMap teams-operator renders per namespace
#    (see apps/developer-control/teams-operator's openbao-agentconfig-
#    templates and ensure_openbao_access) — holds spiffe-helper's config and
#    the openbao-agent's HCL (which embeds this namespace's JWT auth role
#    name), so it must exist in this namespace *before* a pod using it can
#    start. A fixed name (`openbao-agent-config`) so the mutation can
#    reference it without knowing the namespace.
#
# Uses Gatekeeper's Assign-can-insert-a-new-list-item-by-name capability
# (pathTests: MustNotExist), same mechanism as the sidecar containers in
# openbao-sidecar-deployment.yaml — verified empirically against a scratch
# Deployment before writing any of this (Gatekeeper docs don't spell this out
# clearly; nothing else in this repo relied on it before now).
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: openbao-spiffe-csi-volume-deployment
spec:
  applyTo:
    - groups: ["apps"]
      kinds: ["Deployment"]
      versions: ["v1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
  location: "spec.template.spec.volumes[name: spiffe-workload-api]"
  parameters:
    pathTests:
      - subPath: "spec.template.spec.volumes[name: spiffe-workload-api]"
        condition: MustNotExist
    assign:
      value:
        name: spiffe-workload-api
        csi:
          driver: csi.spiffe.io
          readOnly: true
---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: openbao-agent-shared-volume-deployment
spec:
  applyTo:
    - groups: ["apps"]
      kinds: ["Deployment"]
      versions: ["v1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
  location: "spec.template.spec.volumes[name: openbao-agent-shared]"
  parameters:
    pathTests:
      - subPath: "spec.template.spec.volumes[name: openbao-agent-shared]"
        condition: MustNotExist
    assign:
      value:
        name: openbao-agent-shared
        emptyDir: {}
---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: openbao-agent-config-volume-deployment
spec:
  applyTo:
    - groups: ["apps"]
      kinds: ["Deployment"]
      versions: ["v1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
  location: "spec.template.spec.volumes[name: openbao-agent-config]"
  parameters:
    pathTests:
      - subPath: "spec.template.spec.volumes[name: openbao-agent-config]"
        condition: MustNotExist
    assign:
      value:
        name: openbao-agent-config
        configMap:
          name: openbao-agent-config
