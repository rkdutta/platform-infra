# Same as openbao-spiffe-volume-deployment.yaml, for Argo Rollouts - the kind
# every current tenant workload (demo-api-go, demo-web-go, demo-api-py,
# demo-web-py) actually uses. Opt-in via the same label, on the Rollout
# itself.
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: openbao-spiffe-csi-volume-rollout
spec:
  applyTo:
    - groups: ["argoproj.io"]
      kinds: ["Rollout"]
      versions: ["v1alpha1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["argoproj.io"]
        kinds: ["Rollout"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
    # Opt-in, not blanket injection - see openbao-spiffe-volume-deployment.yaml's header.
    labelSelector:
      matchLabels:
        platform.example.com/openbao-access: "true"
  location: "spec.template.spec.volumes[name: spiffe-workload-api]"
  parameters:
    pathTests:
      - subPath: "spec.template.spec.volumes[name: spiffe-workload-api]"
        condition: MustNotExist
    assign:
      value:
        name: spiffe-workload-api
        csi:
          driver: csi.spiffe.io
          readOnly: true
---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: openbao-agent-shared-volume-rollout
spec:
  applyTo:
    - groups: ["argoproj.io"]
      kinds: ["Rollout"]
      versions: ["v1alpha1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["argoproj.io"]
        kinds: ["Rollout"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
    # Opt-in, not blanket injection - see openbao-spiffe-volume-deployment.yaml's header.
    labelSelector:
      matchLabels:
        platform.example.com/openbao-access: "true"
  location: "spec.template.spec.volumes[name: openbao-agent-shared]"
  parameters:
    pathTests:
      - subPath: "spec.template.spec.volumes[name: openbao-agent-shared]"
