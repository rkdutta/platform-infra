---
apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: openbao-agent-config-volume-rollout
spec:
  applyTo:
    - groups: ["argoproj.io"]
      kinds: ["Rollout"]
      versions: ["v1alpha1"]
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["argoproj.io"]
        kinds: ["Rollout"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
    # Opt-in, not blanket injection - see openbao-spiffe-volume-deployment.yaml's header.
    labelSelector:
      matchLabels:
        platform.example.com/openbao-access: "true"
  location: "spec.template.spec.volumes[name: openbao-agent-config]"
  parameters:
    pathTests:
      - subPath: "spec.template.spec.volumes[name: openbao-agent-config]"
        condition: MustNotExist
    assign:
      value:
        name: openbao-agent-config
        configMap:
          name: openbao-agent-config
