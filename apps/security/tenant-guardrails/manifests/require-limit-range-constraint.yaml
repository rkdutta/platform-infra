apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireLimitRange
metadata:
  name: tenant-require-limit-range
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
