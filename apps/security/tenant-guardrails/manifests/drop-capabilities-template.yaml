# Pod Security Context, part 2: every container must drop all Linux
# capabilities; anything re-added must be on the constraint's allow-list
# (empty by default - see drop-capabilities-constraint.yaml).
#
# deny: current tenant workloads already set capabilities.drop: [ALL] with
# no adds - this can't newly break anything that's already compliant.
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sdropcapabilities
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sDropCapabilities
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedCapabilities:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdropcapabilities

        all_containers[c] { c := input.review.object.spec.containers[_] }
        all_containers[c] { c := input.review.object.spec.initContainers[_] }
        all_containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        violation[{"msg": msg}] {
          c := all_containers[_]
          not drops_all(c)
          msg := sprintf("container <%v> must drop the ALL capability (securityContext.capabilities.drop)", [c.name])
        }

        violation[{"msg": msg}] {
          c := all_containers[_]
          added := c.securityContext.capabilities.add[_]
          allowed := {a | a := input.parameters.allowedCapabilities[_]}
          not allowed[added]
          msg := sprintf("container <%v> adds capability %v, which is not on the allow-list", [c.name, added])
        }

        drops_all(c) {
          dropped := {d | d := c.securityContext.capabilities.drop[_]}
          dropped["ALL"]
        }
