apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireApplicationProject
metadata:
  name: require-application-project
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["argoproj.io"]
        kinds: ["Application"]
    namespaces:
      - argocd
  parameters:
    # An Application may not target the permissive built-in project (or leave it
    # unset, which resolves to "default").
    deniedProjects:
      - default
      - ""
    # Break-glass / bootstrap: the root app-of-apps (bootstrap/root-app.yaml) is
    # applied by the cluster-admin kubeconfig (system:masters) and legitimately
    # uses project "default".
    allowedGroups:
      - system:masters
