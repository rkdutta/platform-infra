apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireExplicitAutomount
metadata:
  name: tenant-require-explicit-automount
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["ServiceAccount"]
    namespaceSelector:
      matchExpressions:
        - key: teams.example.com/team-id
          operator: Exists
