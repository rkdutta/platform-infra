# Tenant isolation, part 4: every tenant namespace should have at least one
# NetworkPolicy - the intended shape is default-deny plus explicit allows,
# but that authoring choice lives in the NetworkPolicy's own spec (podSelector
# + policyTypes) and isn't something a generic admission check can verify;
# this constraint enforces the enforceable half - that isolation exists at
# all - and relies on review to confirm each one is actually default-deny.
#
# dryrun: no tenant namespace has any NetworkPolicy today - flipping this to
# deny would block every future pod in team-jack-dev/team-jack-default until
# policies are backfilled. Audit first.
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srequirenetworkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNetworkPolicy
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenetworkpolicy

        # See require-resource-quota-template.yaml for why this uses an
        # existence rule + `not` rather than object.get()+count(): the
        # latter stays undefined (not 0) when the whole namespace path is
        # missing from data.inventory, which is exactly the "zero
        # NetworkPolicies" case this rule exists to catch.
        violation[{"msg": msg}] {
          ns := input.review.object.metadata.namespace
          not has_networkpolicy(ns)
          msg := sprintf("namespace %v must have at least one NetworkPolicy", [ns])
        }

        has_networkpolicy(ns) {
          data.inventory.namespace[ns]["networking.k8s.io/v1"]["NetworkPolicy"][_]
        }
