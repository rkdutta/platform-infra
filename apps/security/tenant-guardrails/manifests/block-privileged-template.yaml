# Pod Security Context, part 1: privileged containers and privilege
# escalation are the most direct container-escape vectors, and requiring
# explicit runAsNonRoot closes the "image runs as root by default" gap.
#
# deny: current tenant workloads already set allowPrivilegeEscalation:false
# and runAsNonRoot:true explicitly, and none run privileged - this can't
# newly break anything that's already compliant.
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sblockprivileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sBlockPrivileged
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblockprivileged

        all_containers[c] { c := input.review.object.spec.containers[_] }
        all_containers[c] { c := input.review.object.spec.initContainers[_] }
        all_containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        violation[{"msg": msg}] {
          c := all_containers[_]
          c.securityContext.privileged == true
          msg := sprintf("container <%v> must not run privileged", [c.name])
        }

        violation[{"msg": msg}] {
          c := all_containers[_]
          not c.securityContext.allowPrivilegeEscalation == false
          msg := sprintf("container <%v> must set securityContext.allowPrivilegeEscalation: false", [c.name])
        }

        violation[{"msg": msg}] {
          not input.review.object.spec.securityContext.runAsNonRoot == true
          msg := "pod must set spec.securityContext.runAsNonRoot: true"
        }
