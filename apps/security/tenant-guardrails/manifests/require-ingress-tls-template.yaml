# Ingress, part 3: every tenant Ingress host should be covered by a TLS
# entry - plaintext HTTP for tenant traffic on a shared ingress controller.
#
# dryrun: current tenant Ingresses (demo-api-go, demo-web-go, demo-api-py,
# demo-web-py) don't set spec.tls today - flipping this to deny would block
# their next reconcile until certs/tls blocks are added. Audit first.
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srequireingresstls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  crd:
    spec:
      names:
        kind: K8sRequireIngressTls
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireingresstls

        tls_hosts[h] {
          t := input.review.object.spec.tls[_]
          h := t.hosts[_]
        }

        violation[{"msg": msg}] {
          rule := input.review.object.spec.rules[_]
          not tls_hosts[rule.host]
          msg := sprintf("Ingress %v host %v is not covered by spec.tls", [input.review.object.metadata.name, rule.host])
        }
