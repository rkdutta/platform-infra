apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Built-in `default` project (platform-infra AppProject does not exist yet).
  project: default

  # Declarative equivalent of:
  #   helm upgrade --install metrics-server metrics-server/metrics-server \
  #     --namespace kube-system --set args={--kubelet-insecure-tls}
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.13.1
    helm:
      releaseName: metrics-server
      values: |
        # --set args={--kubelet-insecure-tls}
        # Needed on clusters (kubeadm, kind, some managed nodes) where the
        # kubelet serving cert isn't signed by the cluster CA.
        args:
          - --kubelet-insecure-tls

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system   # kube-system already exists; no CreateNamespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
