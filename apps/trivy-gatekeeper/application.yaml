apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-gatekeeper
  namespace: argocd
  annotations:
    # Apply after gatekeeper + trivy-operator (needs their CRDs).
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Architecture B policy: Gatekeeper syncs Trivy's VulnerabilityReport CRDs and
  # a referential constraint audits pods against them (fails on Critical CVEs).
  source:
    repoURL: https://github.com/rkdutta/platform-infra.git
    targetRevision: main
    path: apps/trivy-gatekeeper/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
