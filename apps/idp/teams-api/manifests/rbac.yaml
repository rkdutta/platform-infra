# Identity + cluster permissions for the Teams API. On top of serving the team
# store, the API now reports each team's compliance with the platform-enforced
# Gatekeeper policies, which it reads (read-only) from the cluster:
#   * namespaces        - to map a team -> its namespace via the operator's
#                         `teams.example.com/team-id` label.
#   * ConstraintTemplates + all Gatekeeper constraint kinds - to read
#     `status.violations[]` per namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teams-api
  namespace: engineering-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teams-api-compliance-reader
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
# Discover which constraint kinds exist.
- apiGroups: ["templates.gatekeeper.sh"]
  resources: ["constrainttemplates"]
  verbs: ["get", "list"]
# Read the constraint objects (kinds are dynamic, so grant the whole group).
- apiGroups: ["constraints.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teams-api-compliance-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teams-api-compliance-reader
subjects:
- kind: ServiceAccount
  name: teams-api
  namespace: engineering-platform
