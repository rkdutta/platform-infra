apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Built-in `default` project (platform-infra AppProject does not exist yet).
  project: default

  # Declarative equivalent of:
  #   helm upgrade falco falcosecurity/falco \
  #     --namespace falco-system \
  #     --set driver.kind=modern_ebpf \
  #     --set falcosidekick.enabled=true \
  #     --set-file customRules."custom_rules\.yaml"=./root-detect-rule.yaml
  #
  # --set-file inlines the file contents as the value of a customRules key, so
  # the rule from root-detect-rule.yaml is embedded below (keep them in sync;
  # that file is just a human-readable reference — ArgoCD reads only this).
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0   # appVersion 0.44.1
    helm:
      releaseName: falco
      values: |
        # --set driver.kind=modern_ebpf
        driver:
          kind: modern_ebpf

        # --set falcosidekick.enabled=true
        falcosidekick:
          enabled: true

        # --set-file customRules."custom_rules\.yaml"=./root-detect-rule.yaml
        # The map key becomes a file dropped into /etc/falco/rules.d and its
        # value is the rule content (kept in sync with root-detect-rule.yaml).
        customRules:
          custom_rules.yaml: |-
            - rule: Detect Root User In Container
              desc: >
                A process was spawned as the root user (uid 0) inside a container.
                Running as root widens the blast radius of a container escape, so flag it.
              condition: >
                spawned_process and container and user.uid = 0
              output: >
                Process running as root in container
                (user=%user.name uid=%user.uid command=%proc.cmdline
                 container=%container.name image=%container.image.repository:%container.image.tag
                 pod=%k8s.pod.name ns=%k8s.ns.name)
              priority: WARNING
              tags: [process, container, root, mitre_privilege_escalation]

            - rule: Detect Privilege Escalation To Root
              desc: >
                A non-root process transitioned to root (setuid to uid 0), e.g. via
                sudo/su or a setuid binary. Often a sign of privilege escalation.
              condition: >
                evt.type in (setuid, setresuid) and evt.dir = < and container
                and evt.arg.uid = 0 and user.uid != 0
              output: >
                Privilege escalation to root detected
                (from_uid=%user.uid to_uid=0 command=%proc.cmdline
                 container=%container.name image=%container.image.repository
                 pod=%k8s.pod.name ns=%k8s.ns.name)
              priority: CRITICAL
              tags: [process, container, root, mitre_privilege_escalation]

  destination:
    server: https://kubernetes.default.svc
    namespace: falco-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Equivalent of `helm upgrade --namespace falco-system` creating the ns.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
