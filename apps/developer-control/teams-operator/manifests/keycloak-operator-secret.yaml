# Client secret for the `teams-operator-sa` Keycloak service-account client,
# used by teams-operator to call teams-api's authenticated /internal/*
# control-plane endpoints (client-credentials grant) — see
# _teams_api_token in teams_operator.py and auth.require_operator in
# teams-api.
#
# DEMO SECRET — the same value is baked into the committed Keycloak realm
# import (apps/security/keycloak/application.yaml, client
# `teams-operator-sa`). Non-sensitive demo credential in this local
# capstone, same footing as teams-api-keycloak-admin. ROTATE for any real
# deployment: change it in the realm client AND here.
apiVersion: v1
kind: Secret
metadata:
  name: teams-operator-keycloak-secret
  namespace: engineering-platform
  labels:
    app: teams-operator
type: Opaque
stringData:
  client-secret: "dev-teams-operator-sa-secret-change-me"
