# Dedicated spiffe-helper config for the teams-operator's OWN sidecar.
#
# This is deliberately SEPARATE from spiffe-helper.conf in this same directory:
# that file is the per-tenant template the operator copies verbatim into every
# tenant namespace's openbao-agent-config ConfigMap (ensure_openbao_access in
# teams_operator.py), so it must stay "openbao"-audience only — a tenant workload
# must never be handed a teams-api credential.
#
# The operator's own sidecar uses THIS file instead, which additionally emits a
# "teams-api"-audience JWT-SVID. The operator presents that SVID as the bearer to
# teams-api's /internal/* endpoints when TEAMS_API_AUTH=svid (A1), replacing the
# teams-operator-sa Keycloak client-credentials token (no Keycloak, no static
# secret). teams-api validates it against SPIRE's JWKS (INTERNAL_AUTH_MODE=svid),
# pinning sub=spiffe://platform.local/ns/engineering-platform/sa/teams-operator.
agent_address = "/spiffe-workload-api/spire-agent.sock"
cert_dir = "/shared"

jwt_svids = [
  {
    jwt_audience = "openbao"
    jwt_svid_file_name = "spiffe-jwt"
  },
  {
    jwt_audience = "teams-api"
    jwt_svid_file_name = "teams-api-jwt"
  }
]
