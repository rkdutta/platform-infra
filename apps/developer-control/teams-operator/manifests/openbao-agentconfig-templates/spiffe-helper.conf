# spiffe-helper config for the sidecar that fetches a tenant workload's
# JWT-SVID (see apps/security/tenant-guardrails's openbao-sidecar-*.yaml
# mutations, which mount this file at /etc/openbao-agent/spiffe-helper.conf).
# Identical for every namespace - no {{ NAMESPACE }} substitution needed,
# unlike agent.hcl in this same directory - but it's delivered the same way
# (per-namespace openbao-agent-config ConfigMap) because a ConfigMap volume
# can only reference a ConfigMap in its own namespace.
agent_address = "/spiffe-workload-api/spire-agent.sock"
cert_dir = "/shared"

jwt_svids = [
  {
    jwt_audience = "openbao"
    jwt_svid_file_name = "spiffe-jwt"
  }
]
