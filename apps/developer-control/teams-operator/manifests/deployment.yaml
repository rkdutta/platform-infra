# Teams Operator — polls the Teams API and reconciles a namespace per team.
# Image is served from Harbor (in-cluster registry, GHCR-replicated — see
# apps/integration-delivery/harbor-replication/). `platform` is a private
# project, hence imagePullSecrets: harbor-pull (a Harbor robot account,
# created out-of-band — see bootstrap/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-operator
  namespace: engineering-platform
  labels:
    app: teams-operator
spec:
  replicas: 1  # single reconciler; no leader election
  selector:
    matchLabels:
      app: teams-operator
  template:
    metadata:
      labels:
        app: teams-operator
    spec:
      serviceAccountName: teams-operator
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: teams-operator
        image: harbor.127.0.0.1.sslip.io/platform/teams-operator:2.0.16
        imagePullPolicy: IfNotPresent
        env:
        # teams-api Service, same (engineering-platform) namespace, port 8000.
        - name: TEAMS_API_URL
          value: "http://teams-api-service.engineering-platform.svc.cluster.local:8000"
        - name: POLL_INTERVAL
          value: "30"
        # Reuses this same Deployment's own harbor-pull Secret so every team
        # namespace the operator provisions can also pull from Harbor's
        # private `platform` project — see ensure_harbor_pull_secret in
        # teams_operator.py. Optional: if harbor-pull isn't there yet (fresh
        # bootstrap, before the runbook step in bootstrap/README.md), the
        # operator just skips imagePullSecret provisioning rather than
        # crash-looping.
        - name: HARBOR_DOCKERCONFIGJSON
          valueFrom:
            secretKeyRef:
              name: harbor-pull
              key: .dockerconfigjson
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["python", "-c", "import sys; sys.exit(0)"]
          initialDelaySeconds: 5
          periodSeconds: 10
