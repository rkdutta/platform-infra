# Identity + cluster permissions for the operator. It watches teams from the
# Teams API and creates/deletes a namespace per team, so it needs cluster-wide
# namespace management (plus event emission). It also syncs teams-api's
# permission model onto real RBAC (RoleBindings per namespace + one
# cluster-admin ClusterRoleBinding) — see teams_operator.py's
# sync_namespace_rbac/sync_admin_binding. That's a real privilege increase for
# this ServiceAccount: it goes from "manages namespace lifecycle" to "decides
# who gets view/edit/cluster-admin anywhere in the cluster" — the enforcement
# arm for what teams-api's DB already decides at the app layer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teams-operator
  namespace: engineering-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teams-operator
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
# RBAC's escalation-prevention check: creating a RoleBinding/ClusterRoleBinding
# that references a Role/ClusterRole you don't yourself hold requires the
# `bind` verb on that specific one. Scoped by resourceNames to exactly the
# three built-in ClusterRoles the operator ever references — not "bind: *".
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  verbs: ["bind"]
  resourceNames: ["view", "edit", "cluster-admin"]
# Lets every team namespace pull from Harbor's private `platform` project
# (see ensure_harbor_pull_secret / ensure_default_sa_pull_secret). `get` is
# pinned to the one Secret name the operator ever touches via resourceNames
# — but Kubernetes RBAC can't scope `create` by resourceNames (a create
# request has no object identity to check against yet), so create is
# necessarily "any Secret, any namespace." The operator's own code is what
# keeps that to just harbor-pull; this is not a read grant (no `get`/`list`
# beyond the one pinned name above), so it can create but never exfiltrate.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["harbor-pull"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "patch"]
  resourceNames: ["default"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teams-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teams-operator
subjects:
- kind: ServiceAccount
  name: teams-operator
  namespace: engineering-platform
