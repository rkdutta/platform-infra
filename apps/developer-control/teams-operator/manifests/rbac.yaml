# Identity + cluster permissions for the operator. It watches teams from the
# Teams API and creates/deletes a namespace per team, so it needs cluster-wide
# namespace management (plus event emission). It also syncs teams-api's
# permission model onto real RBAC (RoleBindings per namespace + one
# cluster-admin ClusterRoleBinding) — see teams_operator.py's
# sync_namespace_rbac/sync_admin_binding. That's a real privilege increase for
# this ServiceAccount: it goes from "manages namespace lifecycle" to "decides
# who gets view/edit/cluster-admin anywhere in the cluster" — the enforcement
# arm for what teams-api's DB already decides at the app layer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teams-operator
  namespace: engineering-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teams-operator
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
# RBAC's escalation-prevention check: creating a RoleBinding/ClusterRoleBinding
# that references a Role/ClusterRole you don't yourself hold requires the
# `bind` verb on that specific one. Scoped by resourceNames to exactly the
# three built-in ClusterRoles the operator ever references — not "bind: *".
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  verbs: ["bind"]
  resourceNames: ["view", "edit", "cluster-admin"]
# Lets every team namespace pull from Harbor's private `platform` project
# (see ensure_harbor_pull_secret / ensure_default_sa_pull_secret). `get` is
# pinned to the one Secret name the operator ever touches via resourceNames
# — but Kubernetes RBAC can't scope `create` by resourceNames (a create
# request has no object identity to check against yet), so create is
# necessarily "any Secret, any namespace." The operator's own code is what
# keeps that to just harbor-pull; this is not a read grant (no `get`/`list`
# beyond the one pinned name above), so it can create but never exfiltrate.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["harbor-pull"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "patch"]
  resourceNames: ["default"]
# Priority-scoped quota buckets per tenant namespace (see
# ensure_priority_quotas). create-if-missing only, like the RoleBindings —
# no `get`/`list` needed since the code never reads one back.
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["create"]
# Default LimitRange per tenant namespace (see ensure_limit_ranges) — same
# create-if-missing reasoning as resourcequotas above.
- apiGroups: [""]
  resources: ["limitranges"]
  verbs: ["create"]
# Default NetworkPolicy per tenant namespace (see ensure_network_policies) —
# same create-if-missing reasoning as resourcequotas above.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create"]
# Per-namespace openbao-agent-config ConfigMap (see ensure_openbao_access) —
# same create-if-missing reasoning as resourcequotas above. Nothing else in
# the operator has needed to create a ConfigMap before now.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
# Argo CD's RBAC ConfigMap, for self-service Project policy blocks (see
# ensure_argocd_rbac_policy / _remove_rbac_policy_block in
# teams_operator.py). Terraform seeds only the static baseline
# (platform-base/argocd.tf's kubernetes_config_map.argocd_rbac,
# configs.rbac.create=false) - this operator owns everything else written
# into it, read-modify-write per project. Pinned by resourceNames to the
# one ConfigMap touched this way; no `create` needed since Terraform always
# creates it first.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"]
  resourceNames: ["argocd-rbac-cm"]
# Argo CD Projects for self-service Project management (see
# ensure_argocd_appproject / delete_argocd_appproject) - full CRUD, unlike
# the create-if-missing-only resources above, since sourceRepos/destinations
# legitimately change after creation (a project gaining a namespace or a
# source repo).
- apiGroups: ["argoproj.io"]
  resources: ["appprojects"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
# Argo CD Applications, read-only + delete only (see
# delete_argocd_applications) - cleans up every Application belonging to a
# project when that project is deleted, since deleting the AppProject does
# not cascade-delete the Applications that reference it. No create/update:
# this operator only ever removes Applications, never creates or edits one
# (that stays a human/GitOps action via Argo CD itself).
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teams-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teams-operator
subjects:
- kind: ServiceAccount
  name: teams-operator
  namespace: engineering-platform
---
# Argo CD githubApp `repo-creds` secrets, for the self-service connected-repos
# feature (see reconcile_github_repo_creds / _delete_repo_secret in
# teams_operator.py; docs/self-service-repos-github-app.md). The operator
# materializes one repo-creds Secret per (account-prefix, installation) in the
# argocd namespace and label-prunes the stale ones, so beyond the cluster-wide
# `create` above it also needs list/get/update/delete here. Deliberately a
# namespaced Role (not extra verbs on the ClusterRole): `list`/`get` on secrets
# can't be scoped by resourceName or label selector, so cluster-wide they'd let
# this ServiceAccount read every secret in the cluster. Confining them to the
# argocd namespace keeps the blast radius to Argo CD's own repo credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teams-operator-repo-creds
  namespace: argocd
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teams-operator-repo-creds
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teams-operator-repo-creds
subjects:
- kind: ServiceAccount
  name: teams-operator
  namespace: engineering-platform
