# Rendered by teams-operator's ensure_network_policies: {{ NAMESPACE }} is
# replaced with the target tenant namespace, then the result is parsed as
# YAML and passed straight to the Kubernetes API — same pattern as
# ../quota-templates/*.yaml and ../limitrange-templates/default.yaml.
#
# podSelector: {} selects every pod in the namespace. Ingress is in
# policyTypes with one allow rule scoped to the shared ingress-nginx
# controller (everything else is denied - this IS "block all ingress" in
# effect, minus the one path the tenant's own public Ingress depends on to
# work at all). Egress is in policyTypes with an explicit "match
# everything" rule (egress: [{}]) -> allow all, deliberately (not just
# "unset" - see the comment on egress below for why that distinction
# matters).
#
# This cluster's CNI (kindnet) DOES enforce NetworkPolicy - confirmed
# empirically (not assumed): a literal zero-exceptions "deny all ingress"
# here 504'd the tenant's own Ingress-routed traffic, because that traffic
# arrives at the pod from the ingress-nginx controller's pod, in a
# different namespace, which a bare deny-all also blocks. Every tenant
# workload today is reached exclusively through that shared ingress
# controller (see apps/security/tenant-guardrails's
# tenant-deny-lb-nodeport/tenant-require-ingress-class - no other ingress
# path is allowed to exist), so this one exception doesn't reopen anything
# the rest of this policy set doesn't already assume.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-default-network-policy
  namespace: "{{ NAMESPACE }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # An empty rule ({}) matches all destinations/ports - explicit "allow
    # everything," not the same as omitting egress rules (which would deny
    # all egress once Egress is in policyTypes) and not the same as leaving
    # Egress out of policyTypes entirely (which would leave egress
    # ungoverned by this policy, relying on there never being another
    # policy in the namespace that also touches Egress).
    - {}
