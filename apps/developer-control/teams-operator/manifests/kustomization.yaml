apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Turns this directory from a plain-manifest source into a Kustomize one so
# the quota-templates/*.yaml, limitrange-templates/*.yaml,
# networkpolicy-templates/*.yaml and openbao-*-templates/* files can be
# packaged into ConfigMaps without copy/pasting their content into a
# manifest by hand (same pattern already used by apps/security/falco/rules
# and apps/integration-delivery/harbor-replication/manifests).
namespace: engineering-platform

resources:
  - deployment.yaml
  - rbac.yaml
  - keycloak-operator-secret.yaml

# Each generator's files become keys in its own ConfigMap — e.g.
# teams-operator-quota-templates has data["critical.yaml"], etc. teams-
# operator mounts each ConfigMap separately and renders every file per
# tenant namespace at apply time — see ensure_priority_quotas /
# ensure_limit_ranges / ensure_network_policies in teams_operator.py.
# Separate ConfigMaps (not one combined) because each is rendered against a
# different Kubernetes API call (ResourceQuota vs LimitRange vs
# NetworkPolicy) - mixing them into one directory would make e.g.
# ensure_priority_quotas try to create a NetworkPolicy as a ResourceQuota.
configMapGenerator:
  - name: teams-operator-quota-templates
    files:
      - quota-templates/critical.yaml
      - quota-templates/standard.yaml
      - quota-templates/besteffort.yaml
  - name: teams-operator-limitrange-templates
    files:
      - limitrange-templates/default.yaml
  - name: teams-operator-networkpolicy-templates
    files:
      - networkpolicy-templates/default.yaml
  # OpenBao access templates (see ensure_openbao_access in teams_operator.py).
  # Unlike the three above, these aren't rendered into typed Kubernetes
  # objects - the policy/role templates become OpenBao HTTP API request
  # bodies (HCL/JSON text, not YAML), and the agentconfig templates become
  # the data keys of a per-namespace `openbao-agent-config` ConfigMap that
  # tenant pods mount (see apps/security/tenant-guardrails's
  # openbao-spiffe-volume-*.yaml mutations).
  - name: teams-operator-openbao-policy-templates
    files:
      - openbao-policy-templates/team.hcl
  - name: teams-operator-openbao-role-templates
    files:
      - openbao-role-templates/team.json
  - name: teams-operator-openbao-agentconfig-templates
    files:
      - openbao-agentconfig-templates/spiffe-helper.conf
      - openbao-agentconfig-templates/agent.hcl

generatorOptions:
  # Keep stable names so deployment.yaml's volumes can reference them
  # directly. A live ConfigMap volume mount updates its files in place on
  # kubelet's own sync period even without a name change or pod restart, and
  # both ensure_* methods re-read their files from disk on every
  # reconciliation cycle anyway - a hash suffix (which would force a rename +
  # a matching volume-reference update on every edit) buys nothing here,
  # unlike harbor-replication's PostSync Job, which needs one to force a
  # fresh run.
  disableNameSuffixHash: true
