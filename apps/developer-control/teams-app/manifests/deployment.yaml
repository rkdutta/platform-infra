# Teams UI — Angular SPA served by nginx (see teams-app/Dockerfile.k8s).
# Baked into the JS bundle at build time:
#   API_URL      = /api  -> nginx reverse-proxies to teams-api-service:8000
#                          (same namespace), so API traffic stays in-cluster.
#   KEYCLOAK_URL = http://platform-auth.127.0.0.1.sslip.io:8080/auth (browser).
# Rebuild + bump the tag to change them. Image is served from the kind local
# registry (localhost:5001 -> kind-registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-app
  namespace: engineering-platform
  labels:
    app: teams-app
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-app
  template:
    metadata:
      labels:
        app: teams-app
        component: frontend
    spec:
      containers:
      - name: teams-app
        # 0.4.5: component cards show Version + Registry + Image (name).
        # 0.4.4: component cards show Registry + Image (name) instead of the
        # full image ref.
        # 0.4.3: team name links to the team namespace rollout list
        # (<ROLLOUTS_URL>/rollouts/<ns>/).
        # 0.4.2: fix dashboard deep-link path to /rollouts/rollout/<ns>/<app>.
        # 0.4.1: component cards deep-link (new tab) to the Argo Rollouts
        # dashboard (baked build ARG ROLLOUTS_URL).
        # 0.4.0: read-only application cards grouped by app.kubernetes.io/part-of
        # (application card -> component cards with metadata). Removed the
        # deploy/promote/discard controls — rollout promotion is now done in the
        # Argo Rollouts dashboard.
        # 0.3.9: add Discard (revert preview to active) to the blue/green
        # controls — POST /api/teams/{id}/apps/{app}/discard -> teams-api.
        # 0.3.8: blue/green management on the app cards — active/preview version,
        # phase, and Promote / Deploy-new-version controls (POST /api/teams/{id}/
        # apps/{app}/promote and .../image -> teams-api).
        # 0.3.7: team cards also show the applications running in the team
        # namespace (name + version), via /api/applications -> teams-api.
        # 0.7.0: per-app compliance badge on each component card, expandable to
        # the verified policies — supply-chain evidence (signed / SBOM / no
        # critical CVEs / quality, from the app-compliance ConfigMap) merged with
        # live per-app Gatekeeper results.
        # 0.6.0: application cards link out — "web" cards to the app page, "api"
        # cards to Swagger docs (URL discovered from the app's Ingress by
        # teams-api). Compliance badge relabeled as NAMESPACE policy compliance
        # (Gatekeeper), clarifying it is not application-level (CVE/signature).
        # 0.5.0: light/dark theme support. Dark is the default; a header toggle
        # (persisted to localStorage) switches themes. All component styling now
        # keys off CSS custom properties defined in styles.css.
        # 0.3.6: team cards show Gatekeeper compliance badge + expandable
        # per-policy breakdown (calls /api/compliance and
        # /api/teams/{id}/compliance -> teams-api).
        # 0.3.5: HTTPS SSO working end-to-end. Baked KEYCLOAK_URL=https://
        # platform-auth...:8443/auth; app.module sets useNonce:false (keycloak-js
        # 22 vs Keycloak 26 nonce mismatch). nginx.k8s.conf proxies /api/* -> teams-api.
        image: harbor.127.0.0.1.sslip.io/platform/teams-app:1.0.9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
