apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teams-app
  namespace: argocd
  # Wave 1: after ingress-nginx (wave 0) so the Ingress has a controller.
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: developer-control
spec:
  # Built-in `default` project (no dedicated AppProject exists yet).
  project: developer-control
  # Deployment/Service/Ingress live in git. `path` points at the manifests/
  # subdir so this Application manifest itself is NOT rendered as a resource.
  source:
    repoURL: https://github.com/rkdutta/platform-infra.git
    targetRevision: main
    path: apps/developer-control/teams-app/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: engineering-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
