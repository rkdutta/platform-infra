# Identity + cluster permissions for the Teams API. On top of serving the team
# store, the API now reports each team's compliance with the platform-enforced
# Gatekeeper policies, which it reads (read-only) from the cluster:
#   * namespaces        - to map a team -> its namespace via the operator's
#                         `teams.example.com/team-id` label.
#   * ConstraintTemplates + all Gatekeeper constraint kinds - to read
#     `status.violations[]` per namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teams-api
  namespace: engineering-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teams-api-compliance-reader
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
# Discover which constraint kinds exist.
- apiGroups: ["templates.gatekeeper.sh"]
  resources: ["constrainttemplates"]
  verbs: ["get", "list"]
# Read the constraint objects (kinds are dynamic, so grant the whole group).
- apiGroups: ["constraints.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list"]
# List the applications a team is running, to show metadata on its cards, and
# map blue/green active/preview selectors to versions via the ReplicaSets.
# Read-only: rollout promotion is handled by the Argo Rollouts dashboard.
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list"]
# Discover each app's external URL (web page / API docs) from its Ingress host.
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
# Read (not write) the Events teams-operator emits on each team namespace
# (see _emit_event in teams_operator.py) - surfaced as a per-team activity
# feed in the Teams portal (events_reader.py).
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
# List the PriorityClasses tenant workloads can be assigned (tenant-critical/
# -standard/-besteffort - see apps/resource/tenant-priority-classes), so the
# application card's "Tier" info popover shows which ones actually exist in
# the cluster rather than a hardcoded, driftable list (priority_classes.py).
# Cluster-scoped, hence the whole group rather than a namespaced Role.
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teams-api-compliance-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teams-api-compliance-reader
subjects:
- kind: ServiceAccount
  name: teams-api
  namespace: engineering-platform
---
# Read the app-compliance ConfigMap (offline supply-chain report) that feeds the
# per-app compliance badge. Namespaced: only teams-api's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teams-api-configmap-reader
  namespace: engineering-platform
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teams-api-configmap-reader
  namespace: engineering-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teams-api-configmap-reader
subjects:
- kind: ServiceAccount
  name: teams-api
  namespace: engineering-platform
