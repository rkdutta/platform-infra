# HMAC key teams-api uses to sign the GitHub App OAuth `state` (see
# main.py _sign_state / docs/self-service-repos-github-app.md). It only protects
# the short-lived connect handshake — it is NOT the GitHub App private key (that
# lives in OpenBao at kv/platform/github-app, read only by teams-operator).
#
# DEMO SECRET — a fixed placeholder value, on the same footing as the other
# committed bootstrap creds in this local capstone. ROTATE for any real
# deployment: generate a random value (e.g. `openssl rand -hex 32`) and replace
# it here, or move it to a git-ignored Secret injected out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: teams-api-github-app
  namespace: engineering-platform
  labels:
    app: teams-api
type: Opaque
stringData:
  state-secret: "dev-github-app-state-secret-change-me"
