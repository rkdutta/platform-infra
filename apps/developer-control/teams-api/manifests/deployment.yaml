# Teams API — FastAPI backend. The team store is persisted to a PersistentVolume
# (see pvc.yaml) mounted at /data, so team data survives pod restarts.
# Image is served from Harbor (in-cluster registry, GHCR-replicated — see
# apps/integration-delivery/harbor-replication/). `platform` is a private
# project, hence imagePullSecrets: harbor-pull (a Harbor robot account,
# created out-of-band — see bootstrap/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-api
  namespace: engineering-platform
  labels:
    app: teams-api
    component: backend
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce, so the old pod
  # must release it before the new pod can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teams-api
  template:
    metadata:
      labels:
        app: teams-api
        component: backend
    spec:
      serviceAccountName: teams-api
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: teams-api
        image: harbor.127.0.0.1.sslip.io/platform/teams-api:2.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: DATA_DIR
          value: "/data"
        # Browser-facing ingress scheme/port, used to turn an app's Ingress host
        # into a clickable URL on its card (web -> page, api -> Swagger docs).
        # Tenant Ingresses now terminate TLS (see demo-*/deploy's tls: blocks),
        # and the kind node maps the ingress controller's 443 -> host 8443
        # (`docker port platform-base-control-plane`: 443/tcp -> 0.0.0.0:8443).
        - name: PUBLIC_INGRESS_SCHEME
          value: "https"
        - name: PUBLIC_INGRESS_PORT
          value: "8443"
        # --- JWT auth (Keycloak) -------------------------------------------
        # Reject unauthenticated calls; validate Keycloak-issued access tokens
        # (RS256) against the realm JWKS. The UI (client teams-ui) and CLI
        # (client teams-cli) both issue tokens from this realm. JWKS is fetched
        # over the in-cluster HTTP Service (no TLS hop); the issuer is the realm's
        # public URL that appears in the token's `iss` claim. Set AUTH_ENABLED
        # "false" to disable enforcement for troubleshooting.
        - name: AUTH_ENABLED
          value: "true"
        - name: OIDC_ISSUER
          value: "https://platform-auth.127.0.0.1.sslip.io:8443/auth/realms/teams"
        - name: OIDC_JWKS_URL
          value: "http://keycloak-keycloakx-http.keycloak.svc/auth/realms/teams/protocol/openid-connect/certs"
        # --- Keycloak Admin API (namespace access management) ----------------
        # teams-api manages the realm's groups/memberships (assign a user to a
        # namespace = add them to its Keycloak group) via the confidential
        # `teams-api-sa` client. If the secret is absent the access-management
        # features degrade (the env ref is optional), but the API still starts.
        - name: KEYCLOAK_BASE_URL
          value: "http://keycloak-keycloakx-http.keycloak.svc/auth"
        - name: KEYCLOAK_REALM
          value: "teams"
        - name: KC_ADMIN_CLIENT_ID
          value: "teams-api-sa"
        - name: KC_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: teams-api-keycloak-admin
              key: client-secret
              optional: true
        # Own namespace, so the app-compliance ConfigMap (per-app supply-chain
        # report) is read from the right place for the compliance badges.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # --- Cluster connection info (GET /kubeconfig) ------------------------
        # What a developer's own machine needs to reach the API server directly
        # (not the in-cluster Service used everywhere else above). Created
        # out-of-band — see bootstrap/README.md — because the API server's host
        # port is assigned dynamically by Docker and isn't knowable at manifest-
        # authoring time; not sensitive (a CA cert, not a credential), hence a
        # ConfigMap rather than a Secret. If absent, /kubeconfig degrades to a
        # clear 503 rather than serving an unusable file (the env refs are
        # optional, same pattern as KC_ADMIN_CLIENT_SECRET above).
        - name: K8S_API_SERVER
          valueFrom:
            configMapKeyRef:
              name: teams-api-k8s-access
              key: server
              optional: true
        - name: K8S_API_CA_CERT
          valueFrom:
            configMapKeyRef:
              name: teams-api-k8s-access
              key: ca.crt
              optional: true
        # What validates Keycloak's TLS cert for the `kubectl oidc-login` exec
        # plugin the kubeconfig embeds. Same platform-tls wildcard cert every
        # ingress in this namespace already uses — no new out-of-band step,
        # this Secret already exists (see bootstrap/README.md's platform-tls
        # section).
        - name: KEYCLOAK_CA_CERT
          valueFrom:
            secretKeyRef:
              name: platform-tls
              key: tls.crt
              optional: true
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: teams-api-data
