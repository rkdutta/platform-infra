# Teams API — FastAPI backend. The team store is persisted to a PersistentVolume
# (see pvc.yaml) mounted at /data, so team data survives pod restarts.
# Image is served from Harbor (in-cluster registry, GHCR-replicated — see
# apps/integration-delivery/harbor-replication/). `platform` is a private
# project, hence imagePullSecrets: harbor-pull (a Harbor robot account,
# created out-of-band — see bootstrap/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-api
  namespace: engineering-platform
  labels:
    app: teams-api
    component: backend
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce, so the old pod
  # must release it before the new pod can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teams-api
  template:
    metadata:
      labels:
        app: teams-api
        component: backend
    spec:
      serviceAccountName: teams-api
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: teams-api
        image: harbor.127.0.0.1.sslip.io/platform/teams-api:2.1.15
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: DATA_DIR
          value: "/data"
        # Browser-facing ingress scheme/port, used to turn an app's Ingress host
        # into a clickable URL on its card (web -> page, api -> Swagger docs).
        # Tenant Ingresses now terminate TLS (see demo-*/deploy's tls: blocks),
        # and the kind node maps the ingress controller's 443 -> host 8443
        # (`docker port platform-base-control-plane`: 443/tcp -> 0.0.0.0:8443).
        - name: PUBLIC_INGRESS_SCHEME
          value: "https"
        - name: PUBLIC_INGRESS_PORT
          value: "8443"
        # --- JWT auth (Keycloak) -------------------------------------------
        # Reject unauthenticated calls; validate Keycloak-issued access tokens
        # (RS256) against the realm JWKS. The UI (client teams-ui) and CLI
        # (client teams-cli) both issue tokens from this realm. JWKS is fetched
        # over the in-cluster HTTP Service (no TLS hop); the issuer is the realm's
        # public URL that appears in the token's `iss` claim. Set AUTH_ENABLED
        # "false" to disable enforcement for troubleshooting.
        - name: AUTH_ENABLED
          value: "true"
        - name: OIDC_ISSUER
          value: "https://platform-auth.127.0.0.1.sslip.io:8443/auth/realms/teams"
        - name: OIDC_JWKS_URL
          value: "http://keycloak-keycloakx-http.keycloak.svc/auth/realms/teams/protocol/openid-connect/certs"
        # --- Keycloak directory READS (assignment picker / user validation) --
        # teams-api READS the realm (list users, resolve a user, read group/role
        # membership) via the confidential `teams-api-sa` client — now scoped to
        # READ-ONLY roles (view-users/query-users/query-groups). It no longer
        # WRITES Keycloak: teams-operator is the sole writer (reconcile_keycloak).
        # If the secret is absent the picker/validation degrade (env ref
        # optional), but the API still starts.
        - name: KEYCLOAK_BASE_URL
          value: "http://keycloak-keycloakx-http.keycloak.svc/auth"
        - name: KEYCLOAK_REALM
          value: "teams"
        - name: KC_ADMIN_CLIENT_ID
          value: "teams-api-sa"
        # FLIP #2 (done): "false" — teams-api no longer WRITES Keycloak;
        # teams-operator is the SOLE writer (reconcile_keycloak, gated by its
        # KC_RECONCILE_ENABLED=true). READS (user lookup / assignment picker)
        # stay on regardless. Rollback to dual-write: set back to "true".
        - name: KC_WRITES_ENABLED
          value: "false"
        # --- A1: how /internal/* authenticates teams-operator -----------------
        # "keycloak" (default) validates the teams-operator-sa Keycloak token
        # (azp check). "svid" validates teams-operator's SPIRE JWT-SVID against
        # SPIRE's JWKS (issuer/audience/exact SPIFFE ID), over TLS trusting
        # platform-tls (reused from KEYCLOAK_CA_CERT below). The USER token path
        # is unchanged in both modes. Flip to "svid" together with the operator's
        # TEAMS_API_AUTH=svid.
        - name: INTERNAL_AUTH_MODE
          # A1 FLIP: /internal/* now validates teams-operator's SPIRE JWT-SVID
          # (no Keycloak). Flip together with the operator's TEAMS_API_AUTH=svid.
          # Rollback: "keycloak".
          value: "svid"
        - name: SPIRE_JWKS_URL
          value: "https://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local/keys"
        - name: SPIRE_ISSUER
          # The `iss` claim on the SVID (trust-domain OIDC issuer) — NOT the
          # svc.cluster.local URL used to FETCH the keys above.
          value: "https://oidc-discovery.platform.local"
        - name: OPERATOR_SPIFFE_ID
          value: "spiffe://platform.local/ns/engineering-platform/sa/teams-operator"
        - name: KC_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: teams-api-keycloak-admin
              key: client-secret
              optional: true
        # Own namespace, so the app-compliance ConfigMap (per-app supply-chain
        # report) is read from the right place for the compliance badges.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # --- Cluster connection info (GET /kubeconfig) ------------------------
        # What a developer's own machine needs to reach the API server directly
        # (not the in-cluster Service used everywhere else above). Created
        # out-of-band — see bootstrap/README.md — because the API server's host
        # port is assigned dynamically by Docker and isn't knowable at manifest-
        # authoring time; not sensitive (a CA cert, not a credential), hence a
        # ConfigMap rather than a Secret. If absent, /kubeconfig degrades to a
        # clear 503 rather than serving an unusable file (the env refs are
        # optional, same pattern as KC_ADMIN_CLIENT_SECRET above).
        - name: K8S_API_SERVER
          valueFrom:
            configMapKeyRef:
              name: teams-api-k8s-access
              key: server
              optional: true
        - name: K8S_API_CA_CERT
          valueFrom:
            configMapKeyRef:
              name: teams-api-k8s-access
              key: ca.crt
              optional: true
        # What validates Keycloak's TLS cert for the `kubectl oidc-login` exec
        # plugin the kubeconfig embeds. Same platform-tls wildcard cert every
        # ingress in this namespace already uses — no new out-of-band step,
        # this Secret already exists (see bootstrap/README.md's platform-tls
        # section).
        - name: KEYCLOAK_CA_CERT
          valueFrom:
            secretKeyRef:
              name: platform-tls
              key: tls.crt
              optional: true
        # --- GitHub App self-service repo connection -------------------------
        # See docs/self-service-repos-github-app.md. GITHUB_APP_SLUG is the App's
        # URL slug (github.com/apps/<slug>). GITHUB_APP_STATE_SECRET signs the
        # OAuth `state`; TEAMS_APP_URL is where the callback bounces the browser
        # back to (the UI host). The App id + private key are NOT here — they live
        # in OpenBao (kv/platform/github-app), read only by teams-operator.
        - name: GITHUB_APP_SLUG
          value: "rkdutta-engineering-platform"
        - name: TEAMS_APP_URL
          value: "https://teams-ui.127.0.0.1.sslip.io:8443"
        # teams-api's OWN external host — where GitHub redirects the App-Manifest
        # registration flow back to (/github/manifest-callback) for per-project
        # connections. Matches the platform App's Setup URL host used by
        # /github/callback (docs/self-service-repos-github-app.md).
        - name: TEAMS_API_PUBLIC_URL
          value: "https://teams-api.127.0.0.1.sslip.io:8443"
        - name: GITHUB_APP_STATE_SECRET
          valueFrom:
            secretKeyRef:
              name: teams-api-github-app
              key: state-secret
              optional: true
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: teams-api-data
