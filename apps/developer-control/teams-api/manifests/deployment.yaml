# Teams API — FastAPI backend. The team store is persisted to a PersistentVolume
# (see pvc.yaml) mounted at /data, so team data survives pod restarts.
# Image is served from the kind local registry (localhost:5001 on the host,
# resolved in-cluster via the containerd mirror -> http://kind-registry:5000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-api
  namespace: engineering-platform
  labels:
    app: teams-api
    component: backend
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce, so the old pod
  # must release it before the new pod can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teams-api
  template:
    metadata:
      labels:
        app: teams-api
        component: backend
    spec:
      serviceAccountName: teams-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: teams-api
        image: harbor.127.0.0.1.sslip.io/platform/teams-api:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: DATA_DIR
          value: "/data"
        # Browser-facing ingress scheme/port, used to turn an app's Ingress host
        # into a clickable URL on its card (web -> page, api -> Swagger docs).
        - name: PUBLIC_INGRESS_SCHEME
          value: "http"
        - name: PUBLIC_INGRESS_PORT
          value: "8080"
        # --- JWT auth (Keycloak) -------------------------------------------
        # Reject unauthenticated calls; validate Keycloak-issued access tokens
        # (RS256) against the realm JWKS. The UI (client teams-ui) and CLI
        # (client teams-cli) both issue tokens from this realm. JWKS is fetched
        # over the in-cluster HTTP Service (no TLS hop); the issuer is the realm's
        # public URL that appears in the token's `iss` claim. Set AUTH_ENABLED
        # "false" to disable enforcement for troubleshooting.
        - name: AUTH_ENABLED
          value: "true"
        - name: OIDC_ISSUER
          value: "https://platform-auth.127.0.0.1.sslip.io:8443/auth/realms/teams"
        - name: OIDC_JWKS_URL
          value: "http://keycloak-keycloakx-http.keycloak.svc/auth/realms/teams/protocol/openid-connect/certs"
        # Own namespace, so the app-compliance ConfigMap (per-app supply-chain
        # report) is read from the right place for the compliance badges.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: teams-api-data
