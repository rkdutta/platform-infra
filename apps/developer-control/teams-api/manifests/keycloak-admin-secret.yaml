# Client secret for the `teams-api-sa` Keycloak service-account client, used by
# teams-api to manage realm groups/memberships (namespace access) via the Admin API.
#
# DEMO SECRET — the same value is baked into the committed Keycloak realm import
# (apps/security/keycloak/teams-realm.json, client `teams-api-sa`). It is a
# non-sensitive demo credential in this local capstone, on the same footing as the
# committed admin/changeme bootstrap creds. ROTATE for any real deployment: change
# it in the realm client AND here (or move it to a git-ignored Secret injected
# out-of-band and let Keycloak generate the client secret).
apiVersion: v1
kind: Secret
metadata:
  name: teams-api-keycloak-admin
  namespace: engineering-platform
  labels:
    app: teams-api
type: Opaque
stringData:
  client-secret: "dev-teams-api-sa-secret-change-me"
