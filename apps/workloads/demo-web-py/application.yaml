apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-web-py
  namespace: argocd
  # Wave 2: after ingress-nginx (0) and demo-api-py (1) — the web tier's browser
  # JS depends on the API ingress being up.
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    plane: workloads
spec:
  project: tenant-workloads
  source:
    repoURL: https://github.com/rkdutta/demo-web-py.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-py
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
