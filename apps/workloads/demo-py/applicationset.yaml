# "demo-py" combination — the Python 3-tier demo (demo-api-py + demo-web-py).
#
# Same static-pointer pattern as demo-go: the manifests live in each app repo
# (…/deploy); platform-infra only holds this ApplicationSet. The list generator
# produces one Argo Application per app (demo-py-demo-api-py, demo-py-demo-web-py),
# each sourcing <repo>//deploy and deployed into team-sss.
#
# The app-repo manifests are namespace-agnostic (blue/green Rollout +
# active/preview Services + Ingress), so Argo places them into
# destination.namespace. The team namespace is created by the teams-operator, so
# there is no CreateNamespace here — the team must exist first.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-py
  namespace: argocd
  labels:
    plane: workloads
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - app: demo-api-py
            repoURL: https://github.com/rkdutta/demo-api-py.git
          - app: demo-web-py
            repoURL: https://github.com/rkdutta/demo-web-py.git
  template:
    metadata:
      name: 'demo-py-{{.app}}'
      labels:
        plane: workloads
        app.kubernetes.io/part-of: demo-py
      annotations:
        argocd.argoproj.io/sync-wave: "5"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: tenant-workloads
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: main
        path: deploy
      destination:
        server: https://kubernetes.default.svc
        namespace: team-jack-default
      # Gatekeeper's default-priority-class mutation (see
      # apps/security/tenant-guardrails) injects priorityClassName into the
      # live Rollout at admission time when this manifest doesn't set one -
      # without this, Argo would see permanent drift on that one field and
      # selfHeal would fight the mutation every cycle.
      ignoreDifferences:
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/spec/priorityClassName
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
