# "demo-go" combination — the Go 3-tier demo (demo-api-go + demo-web-go).
#
# platform-infra stays STATIC: this ApplicationSet is just a pointer. The actual
# Kubernetes manifests live in each application's own repo (…/deploy), so app
# owners change their deployment without touching platform-infra.
#
# The list generator produces one Argo Application per app
# (demo-go-demo-api-go, demo-go-demo-web-go), each sourcing <repo>//deploy and
# deployed into the tenant namespace. The app-repo manifests are namespace-
# agnostic (blue/green Rollout + active/preview Services + Ingress), so Argo
# places them into destination.namespace. The team namespace is created by the
# teams-operator, so there is no CreateNamespace here — the team must exist first.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-go
  namespace: argocd
  labels:
    plane: workloads
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - app: demo-api-go
            repoURL: https://github.com/rkdutta/demo-api-go.git
          - app: demo-web-go
            repoURL: https://github.com/rkdutta/demo-web-go.git
  template:
    metadata:
      name: 'demo-go-{{.app}}'
      labels:
        plane: workloads
        app.kubernetes.io/part-of: demo-go
      annotations:
        argocd.argoproj.io/sync-wave: "5"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: tenant-workloads
      source:
        repoURL: '{{.repoURL}}'
        targetRevision: main
        path: deploy
      destination:
        server: https://kubernetes.default.svc
        namespace: team-jack-dev
      # Gatekeeper's default-priority-class mutation (see
      # apps/security/tenant-guardrails) injects priorityClassName into the
      # live Rollout at admission time when this manifest doesn't set one -
      # without this, Argo would see permanent drift on that one field and
      # selfHeal would fight the mutation every cycle.
      #
      # Both demo-go apps opt in to tenant-guardrails's OpenBao mutations
      # (platform.example.com/openbao-access: "true" on the Rollout's own
      # labels - see platform-infra/docs/openbao-spiffe-access.md) - those
      # mutations inject the spiffe-workload-api/openbao-agent-shared/
      # openbao-agent-config volumes and the spiffe-helper/openbao-agent
      # containers, none of which exist in either app repo's own manifest.
      # Same reasoning as priorityClassName, but for whole arrays rather
      # than one scalar - ignoring the full containers/volumes arrays (not
      # just the injected entries) is the tradeoff: Argo/selfHeal stop
      # noticing drift on this app's *own* container/volume changes too,
      # not just the mutation's. Accepted because there's no
      # index-independent way to ignore "only entries not in git" with
      # jsonPointers, and a fragile index-based ignore (e.g.
      # /spec/template/spec/containers/1) would silently point at the wrong
      # entry the moment either app adds a second container/volume of its
      # own.
      ignoreDifferences:
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/spec/priorityClassName
            - /spec/template/spec/volumes
            - /spec/template/spec/containers
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
