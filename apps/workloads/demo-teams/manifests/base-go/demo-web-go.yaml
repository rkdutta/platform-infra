# demo-web-go — the web tier of the Go 3-tier demo, as a blue/green Rollout.
# Part of the "demo-go" application card (separate from the Python "demo-py"
# card). Named demo-web-go so the card + Rollouts dashboard match; the image repo
# stays localhost:5001/demo-web (unchanged, still signed).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-web-go
  labels:
    app: demo-web-go
    app.kubernetes.io/name: demo-web-go
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/part-of: demo-go
    # Classifies the app for the Teams portal: a "web" card links to the page.
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-web-go
  template:
    metadata:
      annotations:
        # Compliance facts seeded from supply-chain/evidence (demo-web 2.0.0).
        platform.example.com/critical-cves: "0"
        platform.example.com/test-coverage: "0"
      labels:
        app: demo-web-go
        app.kubernetes.io/name: demo-web-go
        app.kubernetes.io/version: "2.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-web-go
          image: harbor.127.0.0.1.sslip.io/platform/demo-web:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
  strategy:
    blueGreen:
      activeService: demo-web-go-active
      previewService: demo-web-go-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-go-active
  labels:
    app: demo-web-go
    app.kubernetes.io/name: demo-web-go
spec:
  selector:
    app: demo-web-go
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-go-preview
  labels:
    app: demo-web-go
    app.kubernetes.io/name: demo-web-go
spec:
  selector:
    app: demo-web-go
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public entry point for the Go web tier. Its browser JS fetches the API
# same-origin at /api (empty API_BASE), so /api routes to the API tier's active
# Service and everything else to this web tier. The Teams portal links the "web"
# card to http://demo-web-go.127.0.0.1.sslip.io:8080/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-web-go
  labels:
    app: demo-web-go
    app.kubernetes.io/name: demo-web-go
spec:
  ingressClassName: nginx
  rules:
    - host: demo-web-go.127.0.0.1.sslip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: demo-api-go-active
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-web-go-active
                port:
                  number: 80
