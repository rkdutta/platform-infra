# demo-api-go — the API tier of the Go 3-tier demo, as a blue/green Rollout.
# Grouped under app.kubernetes.io/part-of: demo-go so the Teams portal shows it
# as a SEPARATE application card ("demo-go") from the Python "demo-py" card. The
# workload/Services are named demo-api-go so the card + Rollouts dashboard match;
# the image repo stays localhost:5001/demo-api (unchanged, still signed).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-api-go
  labels:
    app: demo-api-go
    app.kubernetes.io/name: demo-api-go
    app.kubernetes.io/version: "2.1.0"
    app.kubernetes.io/part-of: demo-go
    # Classifies the app for the Teams portal: an "api" card links to its docs.
    app.kubernetes.io/component: api
  annotations:
    # Where this API serves its Swagger/OpenAPI UI. The Teams portal links the
    # "api" card to <ingress-host>/docs. 2.1.0 adds this endpoint to the Go API.
    platform.example.com/docs-path: /docs
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-api-go
  template:
    metadata:
      labels:
        app: demo-api-go
        app.kubernetes.io/name: demo-api-go
        app.kubernetes.io/version: "2.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api-go
          image: harbor.127.0.0.1.sslip.io/platform/demo-api:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
  strategy:
    blueGreen:
      activeService: demo-api-go-active
      previewService: demo-api-go-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-go-active
  labels:
    app: demo-api-go
    app.kubernetes.io/name: demo-api-go
spec:
  selector:
    app: demo-api-go
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-go-preview
  labels:
    app: demo-api-go
    app.kubernetes.io/name: demo-api-go
spec:
  selector:
    app: demo-api-go
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Direct host for the Go API tier, so its Swagger UI (/docs, added in 2.1.0) is
# reachable in the browser. Routes to the blue/green active Service. The Teams
# portal links the "api" card to http://demo-api-go.127.0.0.1.sslip.io:8080/docs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api-go
  labels:
    app: demo-api-go
    app.kubernetes.io/name: demo-api-go
spec:
  ingressClassName: nginx
  rules:
    - host: demo-api-go.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api-go-active
                port:
                  number: 80
