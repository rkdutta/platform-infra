# demo-api-py API tier as a BLUE/GREEN Argo Rollout, managed from the Teams
# portal. Uses the app's default in-memory DB (DATABASE_URL unset). activeService
# serves live traffic; a new version rolls out behind previewService and is
# promoted manually. Namespace is set by the per-team overlay.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-api-py
  labels:
    app: demo-api-py
    app.kubernetes.io/name: demo-api-py
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: demo-py
    # Classifies the app for the Teams portal: an "api" card links to its docs.
    app.kubernetes.io/component: api
  annotations:
    # Where this API serves its Swagger/OpenAPI UI (FastAPI default). The Teams
    # portal links the "api" card to <ingress-host>/docs.
    platform.example.com/docs-path: /docs
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-api-py
  template:
    metadata:
      labels:
        app: demo-api-py
        app.kubernetes.io/name: demo-api-py
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api-py
          image: harbor.127.0.0.1.sslip.io/platform/demo-api-py:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    blueGreen:
      activeService: demo-api-py-active
      previewService: demo-api-py-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-py-active
  labels:
    app: demo-api-py
    app.kubernetes.io/name: demo-api-py
spec:
  selector:
    app: demo-api-py
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-py-preview
  labels:
    app: demo-api-py
    app.kubernetes.io/name: demo-api-py
spec:
  selector:
    app: demo-api-py
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Direct host for the API tier, so its Swagger UI (/docs) is reachable in the
# browser. Routes to the blue/green active Service. The Teams portal links the
# "api" card to http://demo-api-py.127.0.0.1.sslip.io:8080/docs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api-py
  labels:
    app: demo-api-py
    app.kubernetes.io/name: demo-api-py
spec:
  ingressClassName: nginx
  rules:
    - host: demo-api-py.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api-py-active
                port:
                  number: 80
