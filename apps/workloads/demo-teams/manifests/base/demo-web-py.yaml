# demo-web-py web tier as a BLUE/GREEN Argo Rollout, managed from the Teams
# portal. activeService serves live (blue) traffic; a new version rolls out
# behind previewService (green) and is promoted manually (autoPromotionEnabled:
# false). Namespace is set by the per-team overlay. The Teams UI surfaces the
# active/preview versions from the app.kubernetes.io/version label per ReplicaSet.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-web-py
  labels:
    app: demo-web-py
    app.kubernetes.io/name: demo-web-py
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/part-of: demo-py
    # Classifies the app for the Teams portal: a "web" card links to the page.
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-web-py
  template:
    metadata:
      labels:
        app: demo-web-py
        app.kubernetes.io/name: demo-web-py
        app.kubernetes.io/version: "2.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-web-py
          image: harbor.127.0.0.1.sslip.io/platform/demo-web-py:2.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    blueGreen:
      activeService: demo-web-py-active
      previewService: demo-web-py-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-py-active
  labels:
    app: demo-web-py
    app.kubernetes.io/name: demo-web-py
spec:
  selector:
    app: demo-web-py
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-py-preview
  labels:
    app: demo-web-py
    app.kubernetes.io/name: demo-web-py
spec:
  selector:
    app: demo-web-py
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public entry point for the web tier. The page's browser JS fetches the API
# same-origin at /api (see demo-web-py: empty API_BASE), so /api is routed to
# the API tier's active Service and everything else to this web tier. The Teams
# portal links the "web" card to http://demo-web-py.127.0.0.1.sslip.io:8080/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-web-py
  labels:
    app: demo-web-py
    app.kubernetes.io/name: demo-web-py
spec:
  ingressClassName: nginx
  rules:
    - host: demo-web-py.127.0.0.1.sslip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: demo-api-py-active
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-web-py-active
                port:
                  number: 80
