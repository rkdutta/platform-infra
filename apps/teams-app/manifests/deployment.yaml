# Teams UI — Angular SPA served by nginx. The browser-facing API and Keycloak
# URLs are baked into the JS bundle at build time (see Dockerfile.compose args):
#   API_URL      = http://teams-api.127.0.0.1.sslip.io:8080
#   KEYCLOAK_URL = http://platform-auth.127.0.0.1.sslip.io:8080/auth
# Rebuild + bump the tag to change them. Image is served from the kind local
# registry (localhost:5001 -> kind-registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-app
  namespace: teams-app
  labels:
    app: teams-app
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-app
  template:
    metadata:
      labels:
        app: teams-app
        component: frontend
    spec:
      containers:
      - name: teams-app
        image: localhost:5001/teams-app:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
