# Teams UI — Angular SPA served by nginx (see teams-app/Dockerfile.k8s).
# Baked into the JS bundle at build time:
#   API_URL      = /api  -> nginx reverse-proxies to teams-api-service:8000
#                          (same namespace), so API traffic stays in-cluster.
#   KEYCLOAK_URL = http://platform-auth.127.0.0.1.sslip.io:8080/auth (browser).
# Rebuild + bump the tag to change them. Image is served from the kind local
# registry (localhost:5001 -> kind-registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-app
  namespace: engineering-platform
  labels:
    app: teams-app
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-app
  template:
    metadata:
      labels:
        app: teams-app
        component: frontend
    spec:
      containers:
      - name: teams-app
        # nginx.k8s.conf regex-proxies /api/* -> teams-api /* (0.2.1 fix; 0.2.0
        # collapsed every /api path to the API root via variable proxy_pass).
        image: localhost:5001/teams-app:0.2.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
