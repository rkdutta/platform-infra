name: Auto approve

on: pull_request_target

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: github.actor == 'renovate[bot]'
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Auto approved automated PR from Renovate bot"

      # renovate.json's platformAutomerge should already ask GitHub to
      # auto-merge these PRs, but that only works once this repo's "Allow
      # auto-merge" setting is on (Settings -> General -> Pull Requests) -
      # this step is the belt-and-suspenders in case that's off or Renovate's
      # own attempt didn't stick. `--auto` enables GitHub's native
      # auto-merge (waits forfffvcv
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}